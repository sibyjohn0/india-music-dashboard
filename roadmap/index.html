<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Your Roadmap · Indie Music India</title>
  <meta name="description" content="Your interactive artist workbook. Build your plan, section by section." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --cream:#FFF7EE; --ink:#241B2E; --pink:#FF4D8D; --yellow:#FFD23F; --softyellow:#FFF3CE;
    --mint:#1FCF9E; --violet:#8B5CF6; --blue:#DCEEFF; --muted:#6B6076;
    --shadow:5px 5px 0 var(--ink); --shadow-sm:3px 3px 0 var(--ink);
  }
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;min-height:100dvh;overflow-x:hidden}
  a{color:var(--pink);font-weight:700}
  .mono{font-family:'Space Mono',monospace;letter-spacing:.5px;text-transform:uppercase}
  h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;line-height:1.1;letter-spacing:-.02em}

  .topbar{position:sticky;top:0;z-index:30;background:var(--cream);border-bottom:2px solid var(--ink)}
  .topbar-in{max-width:660px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:11px 18px}
  .brand{font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);flex:0 0 auto}
  .brand .dot{width:13px;height:13px;border-radius:50%;background:var(--pink);border:2px solid var(--ink)}
  .crumb{font-size:13px;font-weight:700;color:var(--muted);margin-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .saved{margin-left:auto;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap;opacity:0;transition:opacity .3s;flex:0 0 auto}
  .saved.show{opacity:1}
  .saved .tick{width:15px;height:15px;border-radius:50%;background:var(--mint);border:1.5px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800}
  .pbar{height:7px;background:var(--softyellow);border-bottom:2px solid var(--ink)}
  .pbar-fill{height:100%;background:var(--pink);width:0;transition:width .35s cubic-bezier(.4,0,.2,1)}

  .stage{max-width:660px;margin:0 auto;padding:22px 18px 150px}

  /* home */
  .hero{background:var(--ink);color:var(--cream);border:2px solid var(--ink);border-radius:20px;padding:28px 24px;box-shadow:6px 6px 0 var(--pink);margin-bottom:20px}
  .hero .kick{font-size:12px;font-weight:700;color:var(--yellow);margin-bottom:11px}
  .hero h1{font-size:clamp(28px,7.5vw,40px);font-weight:800;color:#fff;margin-bottom:12px}
  .hero p{font-size:16px;color:#E7DEF2;max-width:520px}
  .ovr{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--ink);border-radius:15px;padding:16px 18px;margin-bottom:8px;box-shadow:var(--shadow-sm)}
  .ovr .big{font-family:'Bricolage Grotesque';font-size:30px;font-weight:800;line-height:1}
  .ovr .lbl{font-size:13px;color:var(--muted);font-weight:600}
  .ovr .track{flex:1;height:12px;background:var(--softyellow);border:2px solid var(--ink);border-radius:20px;overflow:hidden}
  .ovr .track i{display:block;height:100%;background:var(--mint)}
  .sec-h{font-size:13px;font-weight:800;margin:22px 2px 12px;color:var(--muted)}
  .seccard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:2px solid var(--ink);border-radius:15px;padding:15px 16px;margin-bottom:11px;cursor:pointer;transition:transform .08s, box-shadow .12s}
  .seccard:active{transform:translateY(1px)}
  .seccard:hover{box-shadow:var(--shadow-sm)}
  .seccard .num{width:34px;height:34px;flex:0 0 auto;border-radius:10px;border:2px solid var(--ink);background:var(--yellow);font-family:'Bricolage Grotesque';font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center}
  .seccard.done .num{background:var(--mint)}
  .seccard .body{flex:1;min-width:0}
  .seccard .nm{display:block;font-weight:800;font-size:16px;line-height:1.25}
  .seccard .tg{display:block;font-size:13px;color:var(--muted);margin-top:2px}
  .seccard .mini{display:block;margin-top:9px;height:7px;background:var(--softyellow);border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
  .seccard .mini i{display:block;height:100%;background:var(--pink)}
  .seccard .cnt{font-size:11px;color:var(--muted);font-weight:700;margin-top:5px;display:block}
  .seccard .arw{font-size:20px;color:var(--muted);flex:0 0 auto}

  /* section stepper */
  .subhead{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .subhead .eyebrow{font-size:11px;font-weight:700;color:var(--pink)}
  .subhead .of{font-size:11px;color:var(--muted);margin-left:auto}
  .sec-intro{background:var(--blue);border:2px solid var(--ink);border-radius:16px;padding:20px;box-shadow:var(--shadow-sm);margin-bottom:6px}
  .sec-intro h1{font-size:clamp(24px,6vw,32px);font-weight:800;margin-bottom:8px}
  .sec-intro p{font-size:16px}
  .lesson{background:#fff;border:2px solid var(--ink);border-left:8px solid var(--violet);border-radius:14px;padding:18px;margin:12px 0 6px;box-shadow:var(--shadow-sm)}
  .lesson-k{font-size:11px;font-weight:700;color:var(--violet);margin-bottom:7px}
  .lesson-idea{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;line-height:1.28;margin-bottom:13px;text-wrap:balance}
  .lesson-pts{list-style:none;display:flex;flex-direction:column;gap:9px;margin:0;padding:0}
  .lesson-pts li{position:relative;padding-left:22px;font-size:14.5px;line-height:1.5}
  .lesson-pts li::before{content:"";position:absolute;left:2px;top:7px;width:9px;height:9px;background:var(--violet);border:2px solid var(--ink);border-radius:50%}
  .lesson-pts a{color:var(--pink);font-weight:700}
  .block h2{font-size:22px;font-weight:800;margin:0 0 6px;text-wrap:balance}
  .block .help{font-size:15px;color:var(--muted);margin:0 0 18px;max-width:560px}
  .gloss{background:#EAFBF4;border:2px solid var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;margin:0 0 18px}
  .gloss b{display:block;font-size:10px;letter-spacing:.5px;margin-bottom:4px;color:#0E8f6c}
  .hint{font-size:13px;color:var(--muted);margin:2px 2px 4px;line-height:1.5}

  .card{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:16px;margin-bottom:12px}
  .qtext{font-size:16px;font-weight:700;margin-bottom:10px;line-height:1.4}
  .flabel{font-size:14px;font-weight:700;margin:0 0 8px;display:block;line-height:1.4}
  .tin{width:100%;font-family:inherit;font-size:16px;font-weight:500;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:11px;padding:12px 13px;outline:none}
  .tin::placeholder{color:#B8B0C2}
  .tin:focus{box-shadow:var(--shadow-sm)}
  textarea.tin{resize:vertical;min-height:88px;line-height:1.5}

  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:600;padding:11px 15px;background:#fff;border:2px solid var(--ink);border-radius:12px;cursor:pointer;user-select:none;transition:transform .08s, box-shadow .12s, background .12s;line-height:1.25}
  .chip:active{transform:translateY(1px)}
  .chip.sel{background:var(--yellow);box-shadow:var(--shadow-sm)}
  .chip.mini{padding:9px 13px;font-size:14px}
  .chip .cdesc{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
  .chip.sel .cdesc{color:var(--ink)}

  /* single-choice big rows (archetype) */
  .optrow{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--ink);border-radius:13px;padding:14px;cursor:pointer;margin-bottom:10px;transition:transform .08s, box-shadow .12s, background .12s}
  .optrow:active{transform:translateY(1px)}
  .optrow.sel{background:var(--blue);box-shadow:var(--shadow-sm)}
  .optrow .dot{width:22px;height:22px;flex:0 0 auto;border-radius:50%;border:2px solid var(--ink);margin-top:1px;display:inline-flex;align-items:center;justify-content:center;background:#fff}
  .optrow.sel .dot{background:var(--ink)}
  .optrow.sel .dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--yellow)}
  .optrow b{font-size:16px;font-weight:800;display:block}
  .optrow span{font-size:14px;color:var(--muted)}

  /* scale 1-10 */
  .scale{display:flex;gap:5px;flex-wrap:wrap}
  .scale button{font-family:'Bricolage Grotesque';font-weight:700;font-size:15px;width:100%;max-width:34px;flex:1 1 26px;aspect-ratio:1;border:2px solid var(--ink);border-radius:9px;background:#fff;cursor:pointer;color:var(--ink)}
  .scale button.on{background:var(--pink);color:#fff}

  /* checklist / check rows */
  .check{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:14px;cursor:pointer;margin-bottom:9px;transition:background .12s}
  .check.on{background:#EAFBF4}
  .check .box{width:23px;height:23px;flex:0 0 auto;border:2px solid var(--ink);border-radius:7px;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:transparent;margin-top:1px}
  .check.on .box{background:var(--mint);color:var(--ink)}
  .check .ctxt{font-size:15px;line-height:1.45}
  .check.on .ctxt{color:var(--muted)}

  /* info */
  .info{background:var(--softyellow);border:2px solid var(--ink);border-radius:14px;padding:18px}
  .info h2{font-size:19px;margin-bottom:10px}
  .info p{font-size:15px;margin-bottom:9px}
  .info p:last-child{margin-bottom:0}
  .info p b{font-weight:800}

  /* table -> stacked row cards */
  .trow{background:#fff;border:2px solid var(--ink);border-radius:13px;padding:15px;margin-bottom:11px}
  .trow .rhead{font-size:15px;font-weight:800;line-height:1.35;margin-bottom:3px}
  .trow .rsub{font-size:13px;color:var(--muted);margin-bottom:11px;line-height:1.4}
  .trow .rsub.pill{display:inline-block;background:var(--blue);border:2px solid var(--ink);border-radius:8px;padding:3px 9px;font-weight:700;color:var(--ink);margin-bottom:11px}
  .tfield{margin-top:11px}
  .tfield:first-child{margin-top:0}
  .trow .check{margin:2px 0 0}

  /* nav */
  .navbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--cream);border-top:2px solid var(--ink)}
  .navbar-in{max-width:660px;margin:0 auto;display:flex;gap:11px;align-items:center;padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
  .btn{font-family:inherit;font-weight:800;font-size:16px;border:2px solid var(--ink);border-radius:12px;padding:13px 20px;cursor:pointer;transition:transform .08s, box-shadow .12s;background:#fff;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--pink);color:#fff;box-shadow:var(--shadow);flex:1}
  .btn.back{flex:0 0 auto}
  .btn.wide{width:100%}

  .privacy{font-size:12px;color:var(--muted);text-align:center;margin-top:22px;padding:0 10px}
  .exportrow{display:flex;gap:11px;margin-top:18px}
  .exportrow .btn{flex:1}

  /* export view */
  .ex-sec{margin-bottom:26px}
  .ex-sec h2{font-size:20px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:12px}
  .ex-item{margin-bottom:12px}
  .ex-item .q{font-size:13px;font-weight:800;color:var(--muted)}
  .ex-item .a{font-size:15px;white-space:pre-wrap}
  .ex-empty{color:var(--muted);font-style:italic;font-size:14px}
  .ex-item .a{overflow-wrap:anywhere;word-break:break-word}
  .tin{overflow-wrap:anywhere}

  /* live feeds (scene + go-deeper) */
  .scene{background:var(--softyellow);border:2px solid var(--ink);border-radius:16px;padding:16px;margin:14px 0 4px;box-shadow:var(--shadow-sm)}
  .deepen{background:var(--blue);border:2px solid var(--ink);border-radius:16px;padding:16px;margin:18px 0 4px;box-shadow:var(--shadow-sm)}
  .scene-h{display:flex;align-items:center;gap:8px;margin-bottom:13px}
  .scene-h .mono{font-size:12px;font-weight:700;color:var(--pink)}
  .scene-date{margin-left:auto;font-size:11px;color:var(--muted)}
  .feedgrp{margin-bottom:15px}
  .feedgrp:last-child{margin-bottom:0}
  .fg-h{font-size:13px;font-weight:800;margin:0 0 9px}
  .fg-list{display:flex;flex-direction:column;gap:8px}
  .feedcard{display:block;background:#fff;border:2px solid var(--ink);border-radius:11px;padding:11px 13px;text-decoration:none;color:var(--ink);font-weight:400;transition:transform .08s, box-shadow .12s}
  .feedcard:active{transform:translateY(1px)}
  .feedcard:hover{box-shadow:var(--shadow-sm)}
  .fc-t{font-weight:700;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
  .fc-m{font-size:12px;color:var(--muted);margin-top:3px}
  .fc-empty{font-size:13px;color:var(--muted);padding:5px 0}
  .feedmore{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;color:var(--pink);text-decoration:none}
  .vidrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .vidrow::-webkit-scrollbar{display:none}
  .vidcard{flex:0 0 150px;background:#fff;border:2px solid var(--ink);border-radius:11px;overflow:hidden;text-decoration:none;color:var(--ink)}
  .vidcard img,.vc-noimg{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#EADFF2;border-bottom:2px solid var(--ink)}
  .vc-t{font-weight:700;font-size:12.5px;line-height:1.3;padding:8px 9px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .vidcard .fc-m{padding:2px 9px 9px}

  @media(max-width:480px){
    .stage{padding:20px 14px 150px}
    .topbar-in,.navbar-in{padding-left:14px;padding-right:14px}
    .crumb{max-width:150px}
  }
  @media print{
    .topbar,.navbar,.pbar,.exportrow,.privacy,.btn{display:none!important}
    body{background:#fff}
    .stage{padding:0;max-width:100%}
    .ex-sec,.ex-item{break-inside:avoid}
  }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="/"><span class="dot"></span> <span class="bt">Indie Music India</span></a>
      <span class="crumb" id="crumb"></span>
      <span class="saved" id="saved"><span class="tick">✓</span> Saved</span>
    </div>
  </header>
  <div class="pbar"><div class="pbar-fill" id="pfill"></div></div>
  <main class="stage" id="stage"></main>
  <nav class="navbar" id="navbar" style="display:none">
    <button class="btn back" id="backBtn" type="button">Back</button>
    <button class="btn primary" id="nextBtn" type="button">Next</button>
  </nav>

  <script src="content.js"></script>
  <script>
  (function(){
    "use strict";
    var WB = window.WORKBOOK, KEY="iim_roadmap_wb_v1";
    if(!WB){ document.getElementById("stage").innerHTML='<p style="padding:24px">Could not load your workbook. Please refresh the page.</p>'; return; }
    var S = load();
    function fresh(){ return { nav:{view:"home"}, ans:{}, seen:false }; }
    function load(){ try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);o.ans=o.ans||{};o.nav=o.nav||{view:"home"};
      if(o.nav.view==="section"){ var sec=WB.sections[o.nav.sec]; if(!sec){o.nav={view:"home"};} else { var bi=o.nav.block||0; if(bi<0||bi>=sec.blocks.length) o.nav.block=0; } }
      return o;}}catch(e){} return fresh(); }
    var saveT;
    function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      var el=document.getElementById("saved"); if(el){el.classList.add("show");clearTimeout(saveT);saveT=setTimeout(function(){el.classList.remove("show");},1400);} }
    function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
    // turn author-written [label](href) tokens into real links, AFTER esc (content is trusted, not user input)
    function linkify(s){ return String(s).replace(/\[([^\]]+)\]\((\/[^)]*|https?:\/\/[^)]*)\)/g,function(_,t,h){ var ext=/^https?:/.test(h); return '<a href="'+h+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+t+'</a>'; }); }
    function esl(s){ return linkify(esc(s)); }  // esc + linkify for author strings that may contain links
    function val(k){ return S.ans[k]; }
    function setVal(k,v){ if(v===""||v==null||v===false){delete S.ans[k];} else {S.ans[k]=v;} save(); }

    /* ---- field keys owned by a block (for progress) ---- */
    function blockKeys(b){
      var ks=[];
      if(b.type==="pillars"){ WB.pillars.forEach(function(_,i){ ks.push(b.id+"."+i+".rating"); if(b.mode!=="review"){ks.push(b.id+"."+i+".strength");ks.push(b.id+"."+i+".gap");}else{ks.push(b.id+"."+i+".now");ks.push(b.id+"."+i+".goal");} }); }
      else if(b.type==="qa"||b.type==="fill"){ b.items.forEach(function(it){ ks.push(b.id+"."+it.id); }); }
      else if(b.type==="chips"){ ks.push(b.id); }
      else if(b.type==="checklist"){ b.items.forEach(function(it){ ks.push(b.id+"."+it.id); }); }
      else if(b.type==="note"){ ks.push(b.id); }
      else if(b.type==="table"){ tableRows(b).forEach(function(r){ b.columns.forEach(function(c){ if(c.type!=="readonly") ks.push(b.id+"."+r.id+"."+c.key); }); }); }
      return ks;
    }
    function isInputBlock(b){ return b.type!=="info"; }
    function blockStarted(b){ return blockKeys(b).some(function(k){ var v=val(k); return v!==undefined&&v!==""&&v!==false; }); }
    function tableRows(b){ if(typeof b.rows==="number"){ var a=[]; for(var i=1;i<=b.rows;i++) a.push({id:"n"+i,cells:{},_n:i}); return a; } return b.rows; }
    function secProgress(sec){ var blocks=sec.blocks.filter(function(b){return isInputBlock(b)&&blockKeys(b).length>0;}); var done=blocks.filter(blockStarted).length; return {done:done,total:blocks.length}; }
    function overall(){ var d=0,t=0; WB.sections.forEach(function(s){ var p=secProgress(s); d+=p.done; t+=p.total; }); return {done:d,total:t,pct:t?Math.round(d/t*100):0}; }

    /* ---- render dispatch ---- */
    var lastNavKey="";
    var stage=document.getElementById("stage"), navbar=document.getElementById("navbar"),
        backBtn=document.getElementById("backBtn"), nextBtn=document.getElementById("nextBtn"),
        crumb=document.getElementById("crumb");
    /* ---- live feeds: news to read, videos to watch, artists to compare ---- */
    var FEEDS={loaded:false,_l:false,_cbs:[],news:[],newsAt:null,artists:[],videos:[]};
    function loadFeeds(cb){
      if(FEEDS.loaded){ if(cb)cb(); return; }
      if(cb)FEEDS._cbs.push(cb);
      if(FEEDS._l) return; FEEDS._l=true;
      function g(u){ return fetch(u).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}); }
      Promise.all([g("/data/news-rss.json"),g("/data/tracked_artists.json"),g("/data/latest.json")]).then(function(res){
        FEEDS.news=(res[0]&&res[0].articles)||[]; FEEDS.newsAt=(res[0]&&res[0].fetched_at)||null;
        FEEDS.artists=(res[1]&&res[1].artists)||[];
        FEEDS.videos=(res[2]&&res[2].videos)||[];
        FEEDS.loaded=true; FEEDS._l=false;
        var cbs=FEEDS._cbs; FEEDS._cbs=[]; cbs.forEach(function(f){ try{f();}catch(e){} });
      });
    }
    var CITY_OK={mumbai:1,delhi:1,bengaluru:1,hyderabad:1,pune:1,goa:1};
    function myLang(){ return val("artist_lang")||""; }
    function myCity(){ return val("artist_city")||""; }
    function cap(s){ return s?s.charAt(0).toUpperCase()+s.slice(1):s; }
    function fmtDate(s){ if(!s)return""; try{return new Date(s).toLocaleDateString("en-IN",{day:"numeric",month:"short"});}catch(e){return"";} }
    function nfmt(n){ try{return Number(n).toLocaleString("en-IN");}catch(e){return n;} }
    function pick(arr,n,fn){ arr=arr||[]; var a=fn?arr.filter(fn):arr.slice(); if(a.length<n){ arr.forEach(function(x){ if(a.indexOf(x)<0)a.push(x); }); } return a.slice(0,n); }

    function newsCards(n){
      var a=FEEDS.news||[]; if(!a.length) return '<div class="fc-empty">Nothing new right now.</div>';
      return a.slice(0,n||3).map(function(x){
        return '<a class="feedcard" href="'+esc(x.url)+'" target="_blank" rel="noopener"><div class="fc-t">'+esc(x.title)+'</div>'+
          '<div class="fc-m">'+esc(x.publication||"")+(x.published_at?' · '+fmtDate(x.published_at):"")+'</div></a>';
      }).join("");
    }
    function videoCards(n){
      var lang=myLang();
      var vids=pick(FEEDS.videos,n||4,lang?function(v){return v.language===lang;}:null);
      if(!vids.length) return '<div class="fc-empty">Loading…</div>';
      return vids.map(function(v){
        var id=v.videoId||v.video_id||v.id||"";
        return '<a class="vidcard" href="https://www.youtube.com/watch?v='+esc(id)+'" target="_blank" rel="noopener">'+
          (v.thumbnail?'<img loading="lazy" src="'+esc(v.thumbnail)+'" alt="">':'<div class="vc-noimg"></div>')+
          '<div class="vc-t">'+esc(v.title||"")+'</div><div class="fc-m">'+esc([v.language,v.genre].filter(Boolean).join(" · "))+'</div></a>';
      }).join("");
    }
    function artistCards(n){
      var lang=myLang(), all=FEEDS.artists||[];
      var list=lang?all.filter(function(a){return a.language===lang;}):all;
      if(list.length<(n||3)) list=all;
      if(!list.length) return '<div class="fc-empty">Loading…</div>';
      return list.slice(0,n||3).map(function(a){
        var l=a.latest_global_listeners||a.latest_india_listeners||0;
        return '<a class="feedcard" href="https://www.youtube.com/channel/'+esc(a.channel_id||"")+'" target="_blank" rel="noopener"><div class="fc-t">'+esc(a.name||"")+'</div>'+
          '<div class="fc-m">'+esc([a.language,a.genre].filter(Boolean).join(" · "))+(l?' · '+nfmt(l)+' listeners':"")+'</div></a>';
      }).join("");
    }

    function sceneInner(){
      if(!FEEDS.loaded) return '<div class="fc-empty">Loading the scene…</div>';
      var lg=myLang()?' · '+esc(myLang()):"";
      return '<div class="scene-h"><span class="mono">Live from the scene</span>'+(FEEDS.newsAt?'<span class="scene-date">updated '+fmtDate(FEEDS.newsAt)+'</span>':"")+'</div>'+
        '<div class="feedgrp"><div class="fg-h">In the news</div><div class="fg-list">'+newsCards(3)+'</div></div>'+
        '<div class="feedgrp"><div class="fg-h">Fresh indie drops to study'+lg+'</div><div class="vidrow">'+videoCards(4)+'</div></div>'+
        '<div class="feedgrp"><div class="fg-h">Artists on the radar'+lg+'</div><div class="fg-list">'+artistCards(3)+'</div>'+
        '<a class="feedmore" href="/radar.html" target="_blank" rel="noopener">See the full radar →</a></div>';
    }
    function fillScene(){ loadFeeds(function(){ var el=document.getElementById("scenePanel"); if(el) el.innerHTML=sceneInner(); }); }

    function lessonHTML(l){
      return '<div class="lesson"><div class="lesson-k mono">The idea</div>'+
        '<div class="lesson-idea">'+esl(l.idea)+'</div>'+
        (l.points&&l.points.length?'<ul class="lesson-pts">'+l.points.map(function(p){return '<li>'+esl(p)+'</li>';}).join("")+'</ul>':"")+'</div>';
    }
    function deepenHTML(sec){
      var d=sec.deepen; if(!d) return "";
      var h='<div class="deepen"><div class="scene-h"><span class="mono">Go deeper</span><span class="scene-date">live from the site</span></div>';
      var reads=[];
      if(d.cityLinks && CITY_OK[myCity()]){ var c=myCity();
        reads.push({label:"Venues in "+cap(c)+" (booking-ready list)",href:"/venues/"+c+"/"});
        reads.push({label:"The "+cap(c)+" scene guide",href:"/guides/independent-music-scene-"+c+"/"});
      }
      (d.read||[]).forEach(function(r){ reads.push(r); });
      if(reads.length){ h+='<div class="fg-h">Read</div><div class="fg-list">'+reads.map(function(r){
        return '<a class="feedcard" href="'+esc(r.href)+'"'+(/^https?:/.test(r.href)?' target="_blank" rel="noopener"':"")+'><div class="fc-t">'+esc(r.label)+'</div></a>'; }).join("")+'</div>'; }
      if(d.watch){ h+='<div class="fg-h">Watch'+(myLang()?' · '+esc(myLang()):"")+'</div><div class="vidrow" id="deepVids"><div class="fc-empty">Loading…</div></div>'; }
      if(d.compare){ h+='<div class="fg-h">Artists to compare to'+(myLang()?' · '+esc(myLang()):"")+'</div><div class="fg-list" id="deepArt"><div class="fc-empty">Loading…</div></div>'; }
      if(d.news){ h+='<div class="fg-h">In the news</div><div class="fg-list" id="deepNews"><div class="fc-empty">Loading…</div></div>'; }
      return h+'</div>';
    }
    function fillDeepen(){ loadFeeds(function(){
      var v=document.getElementById("deepVids"); if(v) v.innerHTML=videoCards(4);
      var a=document.getElementById("deepArt"); if(a) a.innerHTML=artistCards(3);
      var n=document.getElementById("deepNews"); if(n) n.innerHTML=newsCards(3);
    }); }

    function render(){
      var v=S.nav.view;
      document.getElementById("pfill").style.width=overall().pct+"%";
      var navKey=v+"|"+(S.nav.sec)+"|"+(S.nav.block);
      if(navKey!==lastNavKey){ window.scrollTo(0,0); lastNavKey=navKey; }
      if(v==="section") return renderSection();
      if(v==="export") return renderExport();
      return renderHome();
    }

    function idxById(id){ for(var i=0;i<WB.sections.length;i++){ if(WB.sections[i].id===id) return i; } return -1; }
    function secCard(i){
      var sec=WB.sections[i], p=secProgress(sec), pct=p.total?Math.round(p.done/p.total*100):0, done=p.total>0&&p.done===p.total;
      return '<button class="seccard'+(done?" done":"")+'" data-sec="'+i+'"><span class="num">'+(done?"✓":(i+1))+'</span>'+
        '<span class="body"><span class="nm">'+esc(sec.name)+'</span><span class="tg">'+esc(sec.tag)+'</span>'+
        '<span class="mini"><i style="width:'+pct+'%"></i></span><span class="cnt">'+(done?"done":p.done+' / '+p.total+' started')+'</span></span>'+
        '<span class="arw">→</span></button>';
    }
    // beginner-first ordering, grouped; established artists see the natural order
    var BEGINNER_GROUPS=[
      {label:"START WITH THESE", ids:["start","context","identity","production"]},
      {label:"NEXT · ONCE YOU'RE READY TO RELEASE", ids:["distribution","rights","social","revenue"]},
      {label:"LATER · AS YOU GROW", ids:["live","team","advanced"]},
      {label:"WRAP-UP & REFERENCE", ids:["plan","resources"]}
    ];
    function renderHome(){
      navbar.style.display="none"; crumb.textContent="";
      var o=overall(), started=o.done>0;
      var rung=val("ladder_now"), beginner=!rung||rung==="1"||rung==="2";
      var h="";
      h+='<div class="hero"><div class="kick mono">Your Roadmap · artist workbook</div>'+
         '<h1>'+(started?"Welcome back.":"Let's build your career, section by section.")+'</h1>'+
         '<p>This is your workbook. These sections take you from who you are to a real 90-day plan. Do one at a time, in any order. Everything saves as you go.</p></div>';
      h+='<div class="ovr"><div><div class="big">'+o.pct+'%</div><div class="lbl">'+o.done+' of '+o.total+' done</div></div>'+
         '<div class="track"><i style="width:'+o.pct+'%"></i></div></div>';

      // groups + start-here button
      var groups = beginner ? BEGINNER_GROUPS : [{label:"THE SECTIONS", ids:WB.sections.map(function(s){return s.id;})}];
      var order=[]; groups.forEach(function(g){ g.ids.forEach(function(id){ order.push(id); }); });
      var firstInc=-1;
      for(var oi=0;oi<order.length;oi++){ var ix=idxById(order[oi]); if(ix<0) continue; var pp=secProgress(WB.sections[ix]); if(pp.done<pp.total){ firstInc=ix; break; } }
      if(firstInc>=0){
        h+='<button class="btn primary wide" style="margin:12px 0 4px" data-sec="'+firstInc+'">'+
           (started?"Jump back in":"Start here")+' · '+esc(WB.sections[firstInc].name)+' →</button>';
      } else {
        h+='<button class="btn primary wide" style="margin:12px 0 4px" id="exportBtn2" type="button">You did it · see your workbook →</button>';
      }
      h+='<div class="hint">'+(beginner
          ? "This order is tuned for artists near the start. Set your level on the Credibility Ladder (in Identity) and it re-tunes."
          : "You're set to rung "+rung+", so everything's in play. Work top to bottom or jump around.")+'</div>';

      h+='<div class="scene" id="scenePanel">'+sceneInner()+'</div>';

      groups.forEach(function(g){
        var ids=g.ids.filter(function(id){return idxById(id)>=0;});
        if(!ids.length) return;
        h+='<div class="sec-h">'+esc(g.label)+'</div>';
        ids.forEach(function(id){ h+=secCard(idxById(id)); });
      });

      h+='<div class="exportrow"><button class="btn primary wide" id="exportBtn" type="button">See &amp; print my workbook</button></div>';
      h+='<p class="privacy">Saved on this device. Soon you\'ll be able to log in and pick it up anywhere.</p>';
      stage.innerHTML=h;
      fillScene();
      S.seen=true; save();
    }

    function renderSection(){
      var sec=WB.sections[S.nav.sec], bi=S.nav.block||0;
      crumb.textContent=sec.name;
      navbar.style.display="";
      var h='<div class="subhead"><span class="eyebrow mono">'+esc(sec.name)+'</span><span class="of mono">'+(bi+1)+' / '+sec.blocks.length+'</span></div>';
      if(bi===0){ h+='<div class="sec-intro"><h1>'+esc(sec.name)+'</h1><p>'+esc(sec.plain)+'</p></div>';
        if(sec.lesson) h+=lessonHTML(sec.lesson); }
      h+='<div class="block">'+renderBlock(sec.blocks[bi])+'</div>';
      var last=bi===sec.blocks.length-1;
      if(last && sec.deepen) h+=deepenHTML(sec);
      stage.innerHTML=h;
      if(last && sec.deepen) fillDeepen();
      backBtn.textContent = bi===0 ? "Contents" : "Back";
      nextBtn.textContent = last ? "Done · back to contents" : "Next";
    }

    /* ---- block renderers ---- */
    function renderBlock(b){
      var head = b.title?'<h2>'+esc(b.title)+'</h2>':"";
      head += b.help?'<p class="help">'+esl(b.help)+'</p>':"";
      head += b.gloss?'<div class="gloss"><b class="mono">In plain words</b>'+esl(b.gloss)+'</div>':"";
      var body="";
      if(b.type==="info") return '<div class="info">'+(b.title?'<h2>'+esc(b.title)+'</h2>':"")+b.body.map(function(p){
          var m=String(p).match(/^([^:]{2,40}):\s(.+)$/); return m?'<p><b>'+esc(m[1])+':</b> '+esl(m[2])+'</p>':'<p>'+esl(p)+'</p>'; }).join("")+'</div>';
      if(b.type==="pillars") body=renderPillars(b);
      else if(b.type==="qa") body=b.items.map(function(it){ return '<div class="card"><div class="qtext">'+esc(it.q)+'</div>'+ta(b.id+"."+it.id,it.ph||"Type your answer")+'</div>'; }).join("");
      else if(b.type==="fill") body=b.items.map(function(it){ var k=b.id+"."+it.id; return '<div class="card">'+(it.label?'<label class="flabel">'+esc(it.label)+'</label>':"")+(it.long?ta(k,it.ph||""):ti(k,it.ph||""))+'</div>'; }).join("");
      else if(b.type==="chips") body=renderChoice(b);
      else if(b.type==="checklist") body=b.items.map(function(it){ return chk(b.id+"."+it.id, it.text); }).join("");
      else if(b.type==="note") body='<div class="card"><label class="flabel">Your notes</label>'+ta(b.id,"Anything you want to remember from this section")+'</div>';
      else if(b.type==="table") body=renderTable(b);
      return head+body;
    }
    function ti(k,ph){ return '<input class="tin" data-k="'+k+'" type="text" value="'+esc(val(k)||"")+'" placeholder="'+esc(ph||"")+'" autocomplete="off">'; }
    function ta(k,ph){ return '<textarea class="tin" data-k="'+k+'" placeholder="'+esc(ph||"")+'">'+esc(val(k)||"")+'</textarea>'; }
    function chk(k,text){ var on=!!val(k); return '<div class="check'+(on?" on":"")+'" data-check="'+k+'"><span class="box">✓</span><span class="ctxt">'+esl(text)+'</span></div>'; }
    function scale(k){ var cur=val(k); var h='<div class="scale">'; for(var i=1;i<=10;i++){ h+='<button type="button" data-scale="'+k+'" data-v="'+i+'" class="'+(String(cur)===String(i)?"on":"")+'">'+i+'</button>'; } return h+'</div>'; }

    function renderPillars(b){
      return WB.pillars.map(function(name,i){
        var base=b.id+"."+i;
        if(b.mode==="review"){
          var was=val("baseline."+i+".rating");
          return '<div class="trow"><div class="rhead">'+esc(name)+'</div>'+
            '<div class="rsub pill">Week 1 rating: '+(was?was+"/10":"-")+'</div>'+
            '<div class="tfield"><label class="flabel">Where I am now</label>'+scale(base+".now")+'</div>'+
            '<div class="tfield"><label class="flabel">90-day goal</label>'+ti(base+".goal","")+'</div></div>';
        }
        return '<div class="trow"><div class="rhead">'+esc(name)+'</div>'+
          '<div class="tfield"><label class="flabel">Rating (1–10)</label>'+scale(base+".rating")+'</div>'+
          '<div class="tfield"><label class="flabel">My biggest strength here</label>'+ti(base+".strength","")+'</div>'+
          '<div class="tfield"><label class="flabel">My biggest gap here</label>'+ti(base+".gap","")+'</div></div>';
      }).join("");
    }

    function renderChoice(b){
      // big option rows if descriptions present, else chips
      var cur=val(b.id);
      if(b.options.some(function(o){return o.desc;})){
        return b.options.map(function(o){ var on=cur===o.v; return '<div class="optrow'+(on?" sel":"")+'" data-choice="'+b.id+'" data-v="'+esc(o.v)+'"><span class="dot"></span><span><b>'+esc(o.label)+'</b><span>'+esc(o.desc||"")+'</span></span></div>'; }).join("");
      }
      return '<div class="chips">'+b.options.map(function(o){ var on=(b.single?cur===o.v:(cur||[]).indexOf(o.v)>-1); return '<div class="chip'+(on?" sel":"")+'" data-choice="'+b.id+'" data-v="'+esc(o.v)+'" data-single="'+(b.single?1:0)+'">'+esc(o.label)+'</div>'; }).join("")+'</div>';
    }

    function renderTable(b){
      var ro=b.columns.filter(function(c){return c.type==="readonly";});
      var inp=b.columns.filter(function(c){return c.type!=="readonly";});
      return tableRows(b).map(function(r){
        var head="", subs=[];
        if(r._n){ head='<div class="rhead">'+r._n+'.</div>'; }
        else {
          ro.forEach(function(c,idx){ var t=r.cells[c.key]||""; if(idx===0) head='<div class="rhead">'+esl(t)+'</div>'; else if(t) subs.push(esl(t)); });
        }
        var sub = subs.length?'<div class="rsub">'+subs.join(" · ")+'</div>':"";
        var fields=inp.map(function(c){ var k=b.id+"."+r.id+"."+c.key;
          if(c.type==="check") return '<div class="tfield">'+chk(k, c.label)+'</div>';
          if(c.type==="chips"){ var cur=val(k); return '<div class="tfield"><label class="flabel">'+esc(c.label)+'</label><div class="chips">'+c.options.map(function(op){ return '<div class="chip mini'+(cur===op?" sel":"")+'" data-choice="'+k+'" data-v="'+esc(op)+'" data-single="1">'+esc(op)+'</div>'; }).join("")+'</div></div>'; }
          return '<div class="tfield"><label class="flabel">'+esc(c.label)+'</label>'+ti(k,"")+'</div>';
        }).join("");
        return '<div class="trow">'+head+sub+fields+'</div>';
      }).join("");
    }

    /* ---- export / print ---- */
    function renderExport(){
      navbar.style.display="none"; crumb.textContent="Your workbook";
      var h='<div class="hero" style="box-shadow:6px 6px 0 var(--mint)"><div class="kick mono">Your workbook</div><h1>Everything you\'ve filled in.</h1><p>Only your answers show here. Print it or save as PDF to keep a copy, or hand it to someone helping you.</p></div>';
      h+='<div class="exportrow"><button class="btn back" id="homeBtn" type="button">← Back</button><button class="btn primary" id="printBtn" type="button">Print / save as PDF</button></div>';
      WB.sections.forEach(function(sec){
        var rows=exportSection(sec);
        if(!rows) return;
        h+='<div class="ex-sec"><h2>'+esc(sec.name)+'</h2>'+rows+'</div>';
      });
      h+='<p class="privacy">Tip: in the print dialog, choose "Save as PDF".</p>';
      stage.innerHTML=h;
    }
    function fmt(v){ if(v===true)return "✓ done"; return esc(v); }
    function exportSection(sec){
      var out="";
      sec.blocks.forEach(function(b){
        if(b.type==="info") return;
        var items="";
        if(b.type==="pillars"){ WB.pillars.forEach(function(nm,i){ var r=b.mode==="review"?val(b.id+"."+i+".now"):val(b.id+"."+i+".rating"); if(r) items+=exq(nm, r+"/10"); }); }
        else if(b.type==="qa"){ b.items.forEach(function(it){ var v=val(b.id+"."+it.id); if(v) items+=exq(it.q,v); }); }
        else if(b.type==="fill"){ b.items.forEach(function(it){ var v=val(b.id+"."+it.id); if(v) items+=exq(it.label||it.id,v); }); }
        else if(b.type==="chips"){ var v=val(b.id); if(v){ var lbl=function(x){var o=b.options.filter(function(op){return op.v===x;})[0];return o?o.label:x;}; items+=exq(b.title, Array.isArray(v)?v.map(lbl).join(", "):lbl(v)); } }
        else if(b.type==="note"){ var v=val(b.id); if(v) items+=exq("Notes",v); }
        else if(b.type==="checklist"){ var done=b.items.filter(function(it){return val(b.id+"."+it.id);}); if(done.length) items+=exq(b.title||"Checklist", done.length+" of "+b.items.length+" ticked"); }
        else if(b.type==="table"){ tableRows(b).forEach(function(r){ var parts=[]; b.columns.forEach(function(c){ if(c.type==="readonly")return; var v=val(b.id+"."+r.id+"."+c.key); if(v) parts.push(c.label+": "+(v===true?"✓":v)); }); if(parts.length){ var lbl=r._n?(b.title+" #"+r._n):(r.cells[(b.columns[0]||{}).key]||b.title); items+=exq(lbl, parts.join(" · ")); } }); }
        if(items) out+=items;
      });
      return out;
    }
    function exq(q,a){ return '<div class="ex-item"><div class="q">'+esc(q)+'</div><div class="a">'+fmt(a)+'</div></div>'; }

    /* ---- events ---- */
    stage.addEventListener("input",function(e){ var t=e.target; if(t.dataset&&t.dataset.k!=null){ setVal(t.dataset.k, t.value); } });
    stage.addEventListener("click",function(e){
      var el;
      if((el=e.target.closest("[data-sec]"))){ S.nav={view:"section",sec:+el.dataset.sec,block:0}; save(); render(); return; }
      if(e.target.closest("#exportBtn")||e.target.closest("#exportBtn2")){ S.nav={view:"export"}; save(); render(); return; }
      if(e.target.closest("#homeBtn")){ S.nav={view:"home"}; save(); render(); return; }
      if(e.target.closest("#printBtn")){ window.print(); return; }
      if((el=e.target.closest("[data-check]"))){ var k=el.dataset.check; setVal(k, !val(k)); el.classList.toggle("on"); el.querySelector(".box").textContent=val(k)?"✓":""; return; }
      if((el=e.target.closest("[data-scale]"))){ var sk=el.dataset.scale, sv=+el.dataset.v; setVal(sk, String(val(sk))===String(sv)?"":sv); el.parentNode.querySelectorAll("button").forEach(function(bn){bn.classList.toggle("on",bn===el&&String(val(sk))===String(sv));}); return; }
      if((el=e.target.closest("[data-choice]"))){
        var ck=el.dataset.choice, cv=el.dataset.v, single=el.dataset.single!=="0";
        if(el.classList.contains("chip")&&!single){ var arr=val(ck)||[]; var idx=arr.indexOf(cv); if(idx>-1)arr.splice(idx,1); else arr.push(cv); setVal(ck, arr.length?arr.slice():""); render(); }
        else { setVal(ck, val(ck)===cv?"":cv); render(); }
        return;
      }
    });
    backBtn.addEventListener("click",function(){ var bi=S.nav.block||0; if(bi===0){ S.nav={view:"home"}; } else { S.nav.block=bi-1; } save(); render(); });
    nextBtn.addEventListener("click",function(){ var sec=WB.sections[S.nav.sec], bi=S.nav.block||0; if(bi>=sec.blocks.length-1){ S.nav={view:"home"}; } else { S.nav.block=bi+1; } save(); render(); });

    render();
  })();
  </script>
</body>
</html>
