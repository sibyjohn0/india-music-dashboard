<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Your Roadmap · Indie Music India</title>
  <meta name="description" content="Your step-by-step plan to release and grow your music. Built for you." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --cream:#FFF7EE; --ink:#241B2E; --pink:#FF4D8D; --yellow:#FFD23F; --softyellow:#FFF3CE;
    --mint:#1FCF9E; --violet:#8B5CF6; --blue:#DCEEFF; --muted:#6B6076; --line:#241B2E;
    --shadow:5px 5px 0 var(--ink);
  }
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;min-height:100dvh;overflow-x:hidden}
  a{color:inherit}
  .mono{font-family:'Space Mono',monospace;letter-spacing:.5px;text-transform:uppercase}
  h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;line-height:1.08;letter-spacing:-.02em}

  /* top bar + progress */
  .topbar{position:sticky;top:0;z-index:20;background:var(--cream);border-bottom:2px solid var(--ink)}
  .topbar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px}
  .brand{font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink)}
  .brand .dot{width:13px;height:13px;border-radius:50%;background:var(--pink);border:2px solid var(--ink);flex:0 0 auto}
  .saved{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap;opacity:0;transition:opacity .3s}
  .saved.show{opacity:1}
  .saved .tick{width:15px;height:15px;border-radius:50%;background:var(--mint);border:1.5px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:var(--ink);font-weight:800}
  .pbar{height:8px;background:var(--softyellow);border-bottom:2px solid var(--ink)}
  .pbar-fill{height:100%;background:var(--pink);width:0;transition:width .35s cubic-bezier(.4,0,.2,1)}

  /* stage */
  .stage{max-width:640px;margin:0 auto;padding:26px 18px 150px;min-height:calc(100dvh - 62px)}
  .stepmeta{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .stepmeta .eyebrow{font-size:11px;font-weight:700;color:var(--pink)}
  .stepmeta .count{font-size:11px;color:var(--muted);margin-left:auto}
  .q-title{font-size:clamp(25px,6.4vw,34px);font-weight:800;margin:0 0 10px;text-wrap:balance}
  .q-help{font-size:16px;color:var(--muted);margin:0 0 22px;max-width:520px}

  /* chips */
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:600;padding:13px 17px;background:#fff;border:2px solid var(--ink);border-radius:13px;cursor:pointer;user-select:none;transition:transform .08s, box-shadow .12s, background .12s;line-height:1.25}
  .chip:active{transform:translateY(1px)}
  .chip .box{width:20px;height:20px;border:2px solid var(--ink);border-radius:6px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:#fff}
  .chip.sel{background:var(--yellow);box-shadow:3px 3px 0 var(--ink)}
  .chip.sel .box{background:var(--ink);color:var(--yellow)}
  .chips.single .chip .box{border-radius:50%}

  /* stacked (single-choice big rows) */
  .stack{display:flex;flex-direction:column;gap:11px}
  .row{display:flex;align-items:flex-start;gap:13px;text-align:left;width:100%;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:16px;cursor:pointer;transition:transform .08s, box-shadow .12s, background .12s}
  .row:active{transform:translateY(1px)}
  .row.sel{background:var(--blue);box-shadow:var(--shadow)}
  .row .rdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);flex:0 0 auto;margin-top:1px;display:inline-flex;align-items:center;justify-content:center;background:#fff}
  .row.sel .rdot{background:var(--ink)}
  .row.sel .rdot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--yellow)}
  .row .rtxt b{display:block;font-size:17px;font-weight:700}
  .row .rtxt span{display:block;font-size:14px;color:var(--muted);margin-top:2px}

  /* text input */
  .tin{width:100%;font-family:inherit;font-size:19px;font-weight:600;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:13px;padding:16px;outline:none}
  .tin::placeholder{color:#B8B0C2;font-weight:500}
  .tin:focus{box-shadow:var(--shadow)}
  textarea.tin{resize:vertical;min-height:96px;line-height:1.5}
  .field+.field{margin-top:16px}
  .flabel{font-size:13px;font-weight:700;margin:0 0 7px;display:block}

  /* info note */
  .note{background:var(--softyellow);border:2px solid var(--ink);border-radius:13px;padding:15px 16px;font-size:15px;margin-top:20px}
  .note b{font-weight:800}

  /* footer nav */
  .navbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--cream);border-top:2px solid var(--ink)}
  .navbar-in{max-width:640px;margin:0 auto;display:flex;gap:12px;align-items:center;padding:13px 18px calc(13px + env(safe-area-inset-bottom))}
  .btn{font-family:inherit;font-weight:800;font-size:16px;border:2px solid var(--ink);border-radius:12px;padding:14px 22px;cursor:pointer;transition:transform .08s, box-shadow .12s;background:#fff;color:var(--ink)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--pink);color:#fff;box-shadow:var(--shadow);flex:1}
  .btn.primary:disabled{background:#F0D9E3;color:#fff;box-shadow:none;cursor:not-allowed}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:14px 8px}
  .btn.back{flex:0 0 auto}

  /* intro / welcome */
  .hero{background:var(--ink);color:var(--cream);border:2px solid var(--ink);border-radius:20px;padding:30px 24px;box-shadow:6px 6px 0 var(--pink);margin-bottom:22px}
  .hero .kick{font-size:12px;font-weight:700;color:var(--yellow);margin-bottom:12px}
  .hero h1{font-size:clamp(30px,8vw,42px);font-weight:800;color:#fff;margin-bottom:14px}
  .hero p{font-size:17px;color:#E7DEF2;max-width:520px}
  .stepslist{list-style:none;margin:18px 0 0;display:flex;flex-direction:column;gap:12px}
  .stepslist li{display:flex;gap:13px;align-items:flex-start;font-size:16px}
  .stepslist .n{width:28px;height:28px;flex:0 0 auto;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);color:var(--ink);font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
  .stepslist b{font-weight:700}
  .stepslist span{color:var(--muted);display:block;font-size:14px}

  /* summary / roadmap */
  .rm-hd{background:var(--yellow);border:2px solid var(--ink);border-radius:18px;padding:24px;box-shadow:var(--shadow);margin-bottom:22px}
  .rm-hd .kick{font-size:12px;font-weight:700;color:var(--ink);opacity:.7}
  .rm-hd h1{font-size:clamp(27px,7vw,38px);font-weight:800;margin:8px 0 8px}
  .rm-hd p{font-size:16px;font-weight:600}
  .rm-sec{margin-bottom:26px}
  .rm-sec h2{font-size:20px;font-weight:800;margin:0 0 4px}
  .rm-sec .sub{font-size:14px;color:var(--muted);margin:0 0 14px}
  .task{display:flex;gap:13px;align-items:flex-start;background:#fff;border:2px solid var(--ink);border-radius:13px;padding:15px;cursor:pointer;margin-bottom:11px;transition:background .12s}
  .task.done{background:#EAFBF4}
  .task .tbox{width:24px;height:24px;flex:0 0 auto;border:2px solid var(--ink);border-radius:7px;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:transparent;margin-top:1px}
  .task.done .tbox{background:var(--mint);color:var(--ink)}
  .task .ttxt{font-size:16px;line-height:1.45}
  .task.done .ttxt{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
  .task .ttxt small{display:block;text-decoration:none;color:var(--muted);font-size:13px;margin-top:3px;line-height:1.4}
  .task .ttxt a{color:var(--pink);font-weight:700}
  .chipline{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
  .tag{font-size:13px;font-weight:700;background:#fff;border:2px solid var(--ink);border-radius:9px;padding:6px 11px}
  .rm-actions{display:flex;flex-direction:column;gap:11px;margin-top:8px}
  .linkcard{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:2px solid var(--ink);border-radius:13px;padding:15px 17px;text-decoration:none;font-weight:700;font-size:16px;transition:transform .08s, box-shadow .12s}
  .linkcard:active{transform:translateY(1px)}
  .linkcard:hover{box-shadow:3px 3px 0 var(--ink)}
  .linkcard small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
  .linkcard .arw{font-size:20px;flex:0 0 auto}
  .printrow{display:flex;gap:11px;flex-wrap:wrap;margin-top:22px}
  .printrow .btn{flex:1;min-width:150px}
  .startover{text-align:center;margin-top:26px}
  .startover button{background:none;border:none;color:var(--muted);font-size:14px;font-weight:600;text-decoration:underline;cursor:pointer;font-family:inherit}

  .privacy{font-size:12px;color:var(--muted);text-align:center;margin-top:26px;padding:0 10px}

  @media(max-width:480px){
    .stage{padding:22px 15px 150px}
    .topbar-in,.navbar-in{padding-left:15px;padding-right:15px}
    .q-title{font-size:26px}
  }

  /* print */
  @media print{
    .topbar,.navbar,.pbar,.printrow,.startover,.privacy,.rm-actions{display:none !important}
    body{background:#fff}
    .stage{padding:0;max-width:100%}
    .task{break-inside:avoid;box-shadow:none}
    .rm-hd{box-shadow:none}
  }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="/"><span class="dot"></span> Indie Music India</a>
      <span class="saved" id="saved"><span class="tick">✓</span> Saved on this phone</span>
    </div>
  </header>
  <div class="pbar"><div class="pbar-fill" id="pfill"></div></div>

  <main class="stage" id="stage"><!-- rendered by JS --></main>

  <nav class="navbar" id="navbar">
    <button class="btn back" id="backBtn" type="button">Back</button>
    <button class="btn primary" id="nextBtn" type="button">Next</button>
  </nav>

  <script>
  (function(){
    "use strict";
    var KEY = "iim_roadmap_v1";

    /* ---------- default state ---------- */
    function fresh(){
      return {
        step: 0,
        a: {
          artist:"", makes:[], languages:[], city:"",
          goal:[], songStatus:"",
          releaseName:"", releaseType:"", releaseWhen:"",
          distributor:"",
          platforms:[], prePosts:[], pitch:[],
          team:"", splitNote:""
        },
        checks: {}
      };
    }
    var S = load();
    function load(){
      try{ var raw = localStorage.getItem(KEY); if(raw){ var o = JSON.parse(raw); o.a = Object.assign(fresh().a, o.a||{}); o.checks = o.checks||{}; return o; } }catch(e){}
      return fresh();
    }
    var saveTimer;
    function save(){
      try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
      var el = document.getElementById("saved");
      if(el){ el.classList.add("show"); clearTimeout(saveTimer); saveTimer=setTimeout(function(){el.classList.remove("show");},1600); }
    }

    /* ---------- step definitions ---------- */
    var STEPS = [
      { kind:"intro" },
      { id:"artist", kind:"text", req:true, eyebrow:"About you", title:"First up, what do you go by?",
        help:"Your artist name, or your real name if you haven't picked one yet.", placeholder:"e.g. your artist name" },
      { id:"makes", kind:"chips", multi:true, req:true, eyebrow:"About you", title:"What kind of music do you make?",
        help:"Tap all that fit. Not sure? Pick the closest one.",
        options:["Rap / hip-hop","Punjabi","Pop","Singer-songwriter","R&B / soul","Indie / alternative","Electronic / DJ","Folk / acoustic","Desi fusion","Something else"] },
      { id:"languages", kind:"chips", multi:true, eyebrow:"About you", title:"Which languages do you sing or rap in?",
        help:"Tap all you use.",
        options:["Punjabi","Hindi","English","Tamil","Telugu","Malayalam","Bengali","Marathi","No words (instrumental)","Other"] },
      { id:"city", kind:"text", eyebrow:"About you", title:"Where are you based?",
        help:"Just your city or town. This helps us point you to the right local shows and scenes.", placeholder:"e.g. Ludhiana" },
      { id:"goal", kind:"chips", multi:true, req:true, eyebrow:"Your goal", title:"In the next 6 months, what would make you happy?",
        help:"Pick up to two. This is what your whole plan will aim at.", max:2,
        options:["Get my first 1,000 listeners","Play my first live show","Land on a Spotify playlist","Make my first money from music","Get better and release more","Get noticed by a label or manager"] },
      { id:"songStatus", kind:"stack", req:true, eyebrow:"Your music", title:"Where's your next song right now?",
        help:"Be honest, this decides your first move.",
        options:[
          {v:"ready", t:"It's finished and ready", d:"Recorded, mixed and mastered. Good to go."},
          {v:"recorded", t:"Recorded, but not mixed", d:"The take is done but it doesn't sound polished yet."},
          {v:"demo", t:"Just a demo or idea", d:"Something on your phone, not properly recorded."},
          {v:"nothing", t:"Nothing yet", d:"You're starting from zero. That's fine."}
        ] },
      { id:"release", kind:"release", eyebrow:"Your next drop", title:"Tell us about the song you'll put out next",
        help:"Don't overthink it. You can change all of this later." },
      { id:"distributor", kind:"stack", eyebrow:"Getting it out", title:"How will your song get onto Spotify & Apple Music?",
        help:"You can't upload directly. A distributor puts your song on every app for you. Which one?",
        note:"A distributor is just a delivery service. Most cost around ₹1,000–2,000 a year and you keep 100% of your earnings.",
        options:[
          {v:"distrokid", t:"DistroKid", d:"The usual first pick. Cheap, simple, unlimited songs."},
          {v:"believe", t:"Believe / TuneCore / others", d:"Also fine. Compare before you pay."},
          {v:"have", t:"I already have one", d:"Great, you're ahead."},
          {v:"help", t:"No idea, help me pick", d:"We'll point you to a plain-English guide."}
        ] },
      { id:"platforms", kind:"chips", multi:true, eyebrow:"Your people", title:"Where do the people who'd like your music hang out?",
        help:"Tap all that apply. This is where you'll build your crowd.",
        options:["Instagram","YouTube","Snapchat","WhatsApp","Spotify","Facebook"] },
      { id:"prePosts", kind:"chips", multi:true, eyebrow:"The plan", title:"Before the song drops, what could you post?",
        help:"Pick a few you'd actually do. These become your countdown.", max:4,
        options:["A studio / recording clip","A snippet of the hook","The story behind the song","A 'coming soon' with the date","Behind-the-scenes of the art","You just talking to camera","A rough video / reel"] },
      { id:"pitch", kind:"chips", multi:true, eyebrow:"Getting heard", title:"How will you get people to actually hear it?",
        help:"Tap the ones you'll try. We'll hand you the tools for each.",
        options:["Pitch to playlist curators","Ask friends to add it to playlists","Send it to reviewers / blogs","Share to every WhatsApp group","Post reels using the song","Pitch Spotify from your artist profile"] },
      { id:"team", kind:"stack", eyebrow:"Money & rights", title:"Who made this song with you?",
        help:"This matters: it decides who owns a share of the money later.",
        options:[
          {v:"solo", t:"Just me", d:"You wrote and made all of it."},
          {v:"beat", t:"Me + a beatmaker / producer", d:"Someone gave you the beat or produced it."},
          {v:"group", t:"A few of us", d:"Co-writers, a featured singer, a band."}
        ] },
      { kind:"summary" }
    ];

    /* ---------- helpers ---------- */
    function firstName(){ var n=(S.a.artist||"").trim(); return n ? n.split(" ")[0] : "there"; }
    function activeSteps(){ return STEPS; }
    function progressPct(){
      var total = STEPS.length - 1; // exclude intro from the bar feel
      var cur = Math.min(S.step, total);
      return Math.round((cur/total)*100);
    }
    function esc(s){ return (s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

    /* ---------- render ---------- */
    var stage = document.getElementById("stage");
    var backBtn = document.getElementById("backBtn");
    var nextBtn = document.getElementById("nextBtn");
    var navbar = document.getElementById("navbar");

    function render(){
      var step = STEPS[S.step];
      document.getElementById("pfill").style.width = progressPct()+"%";
      window.scrollTo(0,0);
      if(step.kind==="intro"){ renderIntro(); return; }
      if(step.kind==="summary"){ renderSummary(); return; }

      navbar.style.display="";
      var human = S.step; // number among non-intro
      var totalQ = STEPS.length - 2; // exclude intro + summary
      var html = '<div class="stepmeta"><span class="eyebrow mono">'+esc(step.eyebrow||"")+'</span>'+
        '<span class="count mono">'+human+' / '+totalQ+'</span></div>'+
        '<h1 class="q-title">'+esc(step.title)+'</h1>'+
        (step.help?'<p class="q-help">'+esc(step.help)+'</p>':"");

      if(step.kind==="text") html += renderText(step);
      else if(step.kind==="chips") html += renderChips(step);
      else if(step.kind==="stack") html += renderStack(step);
      else if(step.kind==="release") html += renderRelease(step);

      if(step.note) html += '<div class="note">'+esc(step.note)+'</div>';
      stage.innerHTML = html;
      wire(step);
      updateNav(step);
    }

    function renderText(step){
      var v = S.a[step.id]||"";
      return '<input class="tin" id="in_'+step.id+'" type="text" value="'+esc(v)+'" placeholder="'+esc(step.placeholder||"")+'" autocomplete="off" />';
    }
    function renderChips(step){
      var sel = S.a[step.id]||[];
      var cls = "chips"+(step.multi?"":" single");
      var h = '<div class="'+cls+'">';
      step.options.forEach(function(o){
        var on = sel.indexOf(o)>-1;
        h += '<div class="chip'+(on?" sel":"")+'" data-v="'+esc(o)+'"><span class="box">'+(on?"✓":"")+'</span>'+esc(o)+'</div>';
      });
      return h+'</div>';
    }
    function renderStack(step){
      var sel = S.a[step.id]||"";
      var h = '<div class="stack">';
      step.options.forEach(function(o){
        var on = sel===o.v;
        h += '<div class="row'+(on?" sel":"")+'" data-v="'+esc(o.v)+'"><span class="rdot"></span>'+
             '<span class="rtxt"><b>'+esc(o.t)+'</b><span>'+esc(o.d)+'</span></span></div>';
      });
      return h+'</div>';
    }
    function renderRelease(step){
      var a=S.a;
      var types=["Single","EP","Album","A music video"];
      var whens=["In a few weeks","1–2 months away","Later this year","Not sure yet"];
      var h='<div class="field"><label class="flabel">What\'s it called? <span style="color:var(--muted);font-weight:500">(a working title is fine)</span></label>'+
        '<input class="tin" id="in_releaseName" type="text" value="'+esc(a.releaseName)+'" placeholder="e.g. song name" autocomplete="off" /></div>';
      h+='<div class="field"><label class="flabel">What is it?</label><div class="chips single" id="rel_type">';
      types.forEach(function(t){ h+='<div class="chip'+(a.releaseType===t?" sel":"")+'" data-v="'+esc(t)+'"><span class="box">'+(a.releaseType===t?"✓":"")+'</span>'+esc(t)+'</div>'; });
      h+='</div></div>';
      h+='<div class="field"><label class="flabel">When are you hoping to drop it?</label><div class="chips single" id="rel_when">';
      whens.forEach(function(t){ h+='<div class="chip'+(a.releaseWhen===t?" sel":"")+'" data-v="'+esc(t)+'"><span class="box">'+(a.releaseWhen===t?"✓":"")+'</span>'+esc(t)+'</div>'; });
      h+='</div></div>';
      return h;
    }

    function renderIntro(){
      navbar.style.display="";
      var resumed = S.a.artist || (S.a.makes&&S.a.makes.length);
      stage.innerHTML =
        '<div class="hero"><div class="kick mono">Your Roadmap · self-serve</div>'+
        '<h1>Let\'s build your plan.</h1>'+
        '<p>Answer a few quick questions about you and your music. At the end you get your own step-by-step plan: exactly what to do next, in order. No jargon. Takes about 5 minutes.</p></div>'+
        '<ul class="stepslist">'+
        '<li><span class="n">1</span><div><b>Tell us about you & your music</b><span>Who you are, what you make.</span></div></li>'+
        '<li><span class="n">2</span><div><b>Your next song and how it gets out</b><span>Where it stands, and getting it on the apps.</span></div></li>'+
        '<li><span class="n">3</span><div><b>Your crowd, your plan, your money</b><span>Who hears it, and keeping what\'s yours.</span></div></li>'+
        '<li><span class="n">4</span><div><b>Your Roadmap</b><span>A checklist made just for you. Tick things off as you go.</span></div></li>'+
        '</ul>'+
        '<p class="privacy">Your answers save automatically on this phone. Nothing is shared. You can come back any time and pick up where you left off.</p>';
      backBtn.style.visibility="hidden";
      nextBtn.textContent = resumed ? "Continue" : "Start →";
      nextBtn.disabled=false;
    }

    /* ---------- wiring ---------- */
    function wire(step){
      if(step.kind==="text"){
        var inp=document.getElementById("in_"+step.id);
        inp.addEventListener("input",function(){ S.a[step.id]=inp.value; save(); updateNav(step); });
        inp.addEventListener("keydown",function(e){ if(e.key==="Enter"&&!nextBtn.disabled){ e.preventDefault(); goNext(); } });
      }
      if(step.kind==="chips"){
        stage.querySelectorAll(".chip").forEach(function(c){
          c.addEventListener("click",function(){ toggleChip(step,c.getAttribute("data-v")); });
        });
      }
      if(step.kind==="stack"){
        stage.querySelectorAll(".row").forEach(function(r){
          r.addEventListener("click",function(){ S.a[step.id]=r.getAttribute("data-v"); save(); render(); });
        });
      }
      if(step.kind==="release"){
        var nm=document.getElementById("in_releaseName");
        nm.addEventListener("input",function(){ S.a.releaseName=nm.value; save(); });
        stage.querySelector("#rel_type").querySelectorAll(".chip").forEach(function(c){
          c.addEventListener("click",function(){ S.a.releaseType=c.getAttribute("data-v"); save(); render(); });
        });
        stage.querySelector("#rel_when").querySelectorAll(".chip").forEach(function(c){
          c.addEventListener("click",function(){ S.a.releaseWhen=c.getAttribute("data-v"); save(); render(); });
        });
      }
    }
    function toggleChip(step, val){
      var arr = S.a[step.id]||[];
      var i = arr.indexOf(val);
      if(step.multi){
        if(i>-1) arr.splice(i,1);
        else { if(step.max && arr.length>=step.max){ arr.shift(); } arr.push(val); }
      } else {
        arr = (i>-1)?[]:[val];
      }
      S.a[step.id]=arr; save(); render();
    }

    /* ---------- nav ---------- */
    function stepComplete(step){
      if(!step.req) return true;
      var v=S.a[step.id];
      if(step.kind==="text") return !!(v&&v.trim());
      if(step.kind==="chips") return !!(v&&v.length);
      if(step.kind==="stack") return !!v;
      return true;
    }
    function updateNav(step){
      backBtn.style.visibility = (S.step===0)?"hidden":"visible";
      var last = S.step===STEPS.length-2;
      nextBtn.textContent = last ? "See my Roadmap →" : "Next";
      nextBtn.disabled = !stepComplete(step);
    }
    function goNext(){
      if(S.step < STEPS.length-1){ S.step++; save(); render(); }
    }
    function goBack(){
      if(S.step>0){ S.step--; save(); render(); }
    }
    backBtn.addEventListener("click",goBack);
    nextBtn.addEventListener("click",function(){
      var step=STEPS[S.step];
      if(step.kind==="intro"||step.kind==="summary"||stepComplete(step)) goNext();
    });

    /* ---------- ROADMAP GENERATION ---------- */
    function goalLine(){
      var g=S.a.goal||[];
      if(!g.length) return "get your music out and grow.";
      var map={
        "Get my first 1,000 listeners":"reach your first 1,000 listeners",
        "Play my first live show":"play your first live show",
        "Land on a Spotify playlist":"land on a Spotify playlist",
        "Make my first money from music":"make your first money from music",
        "Get better and release more":"release consistently and level up",
        "Get noticed by a label or manager":"get on a label or manager's radar"
      };
      var parts=g.map(function(x){return map[x]||x.toLowerCase();});
      return parts.join(" and ")+".";
    }
    function tasks(){
      var a=S.a, t=[], songName = a.releaseName?('"'+a.releaseName+'"'):"your song";
      // 1. first move by status
      if(a.songStatus==="ready"){
        t.push({id:"t_deliver", txt:"Get "+songName+" to a distributor this week", sub: a.distributor==="distrokid"?"You picked DistroKid. Set a release date 3–4 weeks out so you have time to pitch.":"Set your release date 3–4 weeks out, you need that gap to pitch."});
      } else if(a.songStatus==="recorded"){
        t.push({id:"t_mix", txt:"Get "+songName+" mixed and mastered first", sub:"This is the difference between sounding home-made and sounding pro. Find a mixing engineer or use an online master."});
      } else if(a.songStatus==="demo"){
        t.push({id:"t_record", txt:"Record "+songName+" properly in the next 2–3 weeks", sub:"A clean recording beats a great idea stuck on your phone. A local studio or a good mic setup works."});
      } else {
        t.push({id:"t_pick", txt:"Pick one song idea and commit to finishing it in 3 weeks", sub:"Don't wait for the perfect one. Momentum beats perfection."});
      }
      // 2. cover art
      t.push({id:"t_art", txt:"Make your cover art, 3000×3000, no blurry text", sub:"This is the first thing anyone sees. Keep it simple and bold."});
      // 3. distributor pick if needed
      if(a.songStatus!=="nothing" && (a.distributor===""||a.distributor==="help")){
        t.push({id:"t_distro", txt:"Choose a distributor to put your music on every app", sub:'Start here: <a href="/toolkit/">our free release toolkit</a>. DistroKid is the usual first pick.'});
      }
      // 4. content countdown
      var pre=a.prePosts||[];
      if(pre.length){
        t.push({id:"t_content", txt:"Line up your countdown posts before drop day", sub:"You chose: "+pre.join(" · ")+". Post 3 of these in the two weeks before release.", tags:pre.slice(0,4)});
      } else {
        t.push({id:"t_content", txt:"Plan 3 posts for the 2 weeks before your song drops", sub:"A snippet, the story behind it, and a 'coming soon' with the date works every time."});
      }
      // 5. drop day
      t.push({id:"t_dropday", txt:"On drop day: post it everywhere at once", sub:"Reel with the song, story with the link, and share to every WhatsApp group you're in."});
      // 6. pitching / getting heard
      var wantsPlaylist = (a.goal||[]).indexOf("Land on a Spotify playlist")>-1 || (a.pitch||[]).indexOf("Pitch to playlist curators")>-1;
      t.push({id:"t_reviewers", txt:"Pitch playlist curators and reviewers, start free", sub:'Use our <a href="/reviewers/">free reviewer list</a> (900+ curators). Send a short, personal note with your link.'});
      if((a.pitch||[]).indexOf("Pitch Spotify from your artist profile")>-1 || wantsPlaylist){
        t.push({id:"t_spotifypitch", txt:"Pitch Spotify's editors from Spotify for Artists", sub:"Do it at least 7 days before release, or you miss the window. It's free and takes 10 minutes."});
      }
      // 7. money & rights
      if(a.team==="beat" || a.team==="group"){
        t.push({id:"t_splits", txt:"Write down who gets what %, before the song is out", sub:"Even a WhatsApp message everyone agrees to counts. Sort it now, not after money shows up."});
      } else {
        t.push({id:"t_rights", txt:"Register as the songwriter so you get all your royalties", sub:'See <a href="/toolkit/">the toolkit</a> for how publishing and royalties work in plain English.'});
      }
      // 8. after
      t.push({id:"t_thanks", txt:"The week after: thank everyone who shared you", sub:"Message every person who reposted or added you to a playlist. This is how a real fanbase starts."});
      // 9. live show if goal
      if((a.goal||[]).indexOf("Play my first live show")>-1){
        t.push({id:"t_live", txt:"Find one open-mic or small gig near you"+(a.city?(" in "+a.city):""), sub:'Check <a href="/live/">upcoming shows</a> and <a href="/venues/">venues</a>. Email a venue and offer to play a short set.'});
      }
      return t;
    }

    function renderSummary(){
      navbar.style.display="none";
      backBtn.style.visibility="visible";
      var a=S.a;
      var makesLine = (a.makes&&a.makes.length)? a.makes.join(", ").toLowerCase() : "your music";
      var T = tasks();
      var doneCount = T.filter(function(x){return S.checks[x.id];}).length;

      var html = '<div class="rm-hd"><div class="kick mono">Your Roadmap</div>'+
        '<h1>'+esc(firstName())+", here's your plan.</h1>"+
        '<p>Next 6 months, aimed at one thing: '+esc(goalLine())+'</p></div>';

      html += '<div class="rm-sec"><h2>Do these, in order</h2>'+
        '<p class="sub">'+doneCount+' of '+T.length+' done · tap to tick off · your progress saves automatically.</p>';
      T.forEach(function(x){
        var done=!!S.checks[x.id];
        html += '<div class="task'+(done?" done":"")+'" data-id="'+x.id+'"><span class="tbox">✓</span>'+
          '<span class="ttxt">'+esc(x.txt)+ (x.sub?'<small>'+x.sub+'</small>':"") + (x.tags?'<span class="chipline">'+x.tags.map(function(tg){return '<span class="tag">'+esc(tg)+'</span>';}).join("")+'</span>':"") +'</span></div>';
      });
      html += '</div>';

      html += '<div class="rm-sec"><h2>Free tools that do the heavy lifting</h2>'+
        '<p class="sub">Everything above is easier with these. All free.</p><div class="rm-actions">'+
        linkcard("/reviewers/","900+ curators & reviewers","Find people who'll actually listen and share")+
        linkcard("/toolkit/","The release toolkit","Step-by-step guides, checklists and templates")+
        linkcard("/tools/royalty-calculator/","Royalty calculator","See what your streams are really worth")+
        linkcard("/live/","Live shows & venues","Where to play near you")+
        '</div></div>';

      html += '<div class="printrow">'+
        '<button class="btn primary" id="printBtn" type="button">Save / print my plan</button>'+
        '<button class="btn" id="editBtn" type="button">Edit my answers</button></div>';

      html += '<div class="rm-sec" style="margin-top:26px"><h2>Want us in your corner?</h2>'+
        '<p class="sub">This plan is yours to run. If you\'d rather have a team building it with you on positioning, releases, month on month, that\'s the programme.</p>'+
        '<div class="rm-actions">'+linkcard("/tiers/","See how we work with artists","Roadmap, Advisory or full Artist Development")+'</div></div>';

      html += '<div class="startover"><button id="resetBtn" type="button">Start over from scratch</button></div>';
      html += '<p class="privacy">Saved on this phone. Soon you\'ll be able to log in and pick this up on any device.</p>';

      stage.innerHTML=html;
      document.getElementById("pfill").style.width="100%";

      stage.querySelectorAll(".task").forEach(function(el){
        el.addEventListener("click",function(){
          var id=el.getAttribute("data-id");
          S.checks[id]=!S.checks[id]; save(); renderSummary();
        });
      });
      document.getElementById("printBtn").addEventListener("click",function(){ window.print(); });
      document.getElementById("editBtn").addEventListener("click",function(){ S.step=1; save(); render(); });
      document.getElementById("resetBtn").addEventListener("click",function(){
        if(confirm("Start over? This clears all your answers on this phone.")){ S=fresh(); save(); render(); }
      });
    }
    function linkcard(href,title,sub){
      return '<a class="linkcard" href="'+href+'"><span>'+esc(title)+'<small>'+esc(sub)+'</small></span><span class="arw">→</span></a>';
    }

    render();
  })();
  </script>
</body>
</html>
