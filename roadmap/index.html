<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Your Roadmap · Indie Music India</title>
  <meta name="description" content="Your interactive artist workbook. Build your plan, section by section." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --cream:#FFF7EE; --ink:#241B2E; --pink:#FF4D8D; --yellow:#FFD23F; --softyellow:#FFF3CE;
    --mint:#1FCF9E; --violet:#8B5CF6; --blue:#DCEEFF; --muted:#6B6076; --pinkd:#D8005E;
    --shadow:5px 5px 0 var(--ink); --shadow-sm:3px 3px 0 var(--ink);
  }
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;min-height:100dvh;overflow-x:hidden}
  a{color:var(--pinkd);font-weight:700}
  .mono{font-family:'Space Mono',monospace;letter-spacing:.5px;text-transform:uppercase}
  h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;line-height:1.1;letter-spacing:-.02em}

  .topbar{position:sticky;top:0;z-index:30;background:var(--cream);border-bottom:2px solid var(--ink)}
  .topbar-in{max-width:660px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:11px 18px}
  .brand{font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);flex:0 0 auto}
  .brand .dot{width:13px;height:13px;border-radius:50%;background:var(--pink);border:2px solid var(--ink)}
  .crumb{font-size:13px;font-weight:700;color:var(--muted);margin-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .saved{margin-left:auto;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap;opacity:0;transition:opacity .3s;flex:0 0 auto}
  .saved.show{opacity:1}
  .saved .tick{width:15px;height:15px;border-radius:50%;background:var(--mint);border:1.5px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800}
  .pbar{height:7px;background:var(--softyellow);border-bottom:2px solid var(--ink)}
  .pbar-fill{height:100%;background:var(--pink);width:0;transition:width .35s cubic-bezier(.4,0,.2,1)}

  .stage{max-width:660px;margin:0 auto;padding:22px 18px 44px}
  body.in-section .stage{padding-bottom:150px}
  .pill-ctx{font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--muted);margin-bottom:8px}

  /* home */
  .hero{background:var(--ink);color:var(--cream);border:2px solid var(--ink);border-radius:20px;padding:28px 24px;box-shadow:6px 6px 0 var(--pink);margin-bottom:20px}
  .hero .kick{font-size:12px;font-weight:700;color:var(--yellow);margin-bottom:11px}
  .hero h1{font-size:clamp(28px,7.5vw,40px);font-weight:800;color:#fff;margin-bottom:12px}
  .hero p{font-size:16px;color:#E7DEF2;max-width:520px}
  .ovr{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:16px 18px;margin-bottom:8px;box-shadow:var(--shadow-sm)}
  .ovr .big{font-family:'Bricolage Grotesque';font-size:30px;font-weight:800;line-height:1}
  .ovr .lbl{font-size:13px;color:var(--muted);font-weight:600}
  .ovr .track{flex:1;height:12px;background:var(--softyellow);border:2px solid var(--ink);border-radius:20px;overflow:hidden}
  .ovr .track i{display:block;height:100%;background:var(--mint)}
  /* section-complete celebration (calm: a check + the numbers moving) */
  .done-cel{text-align:center;padding:26px 16px 8px;max-width:460px;margin:0 auto}
  .done-badge{width:66px;height:66px;margin:0 auto 16px;border-radius:50%;background:var(--mint);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;box-shadow:4px 4px 0 var(--ink);animation:donepop .42s ease-out}
  .done-k{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;letter-spacing:1px;color:#0B6B4F;margin-bottom:8px;text-transform:uppercase}
  .done-cel h1{font-size:clamp(25px,6vw,33px);font-weight:800;margin-bottom:18px;text-wrap:balance}
  .done-prog{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
  .done-pct{font-family:'Bricolage Grotesque';font-size:30px;font-weight:800;line-height:1;margin-bottom:10px}
  .done-prog .track{height:12px;background:var(--softyellow);border:2px solid var(--ink);border-radius:20px;overflow:hidden}
  .done-prog .track i{display:block;height:100%;background:var(--mint);transition:width .6s cubic-bezier(.4,0,.2,1)}
  .done-lbl{font-size:13px;color:var(--muted);font-weight:600;margin-top:10px}
  .done-msg{font-size:15px;line-height:1.5;margin-bottom:16px}
  @keyframes donepop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  @media(prefers-reduced-motion:reduce){.done-badge{animation:none}.done-prog .track i{transition:none}}
  .focus{background:#EDE4FF;border:2px solid var(--ink);border-radius:16px;padding:16px 18px;margin:10px 0 4px;box-shadow:var(--shadow-sm)}
  .focus-k{font-size:11px;font-weight:700;color:#6D28D9;margin-bottom:8px}
  .focus-line{font-size:15px;line-height:1.5;margin-bottom:9px;overflow-wrap:anywhere}
  .focus-line:last-child{margin-bottom:0}
  .focus-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
  .focus-chip{font-family:inherit;font-weight:800;font-size:13px;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;box-shadow:var(--shadow-sm);color:var(--ink)}
  .focus-chip:active{transform:translateY(1px)}
  .foryou{display:inline-block;font-size:9px;background:var(--pinkd);color:#fff;border:1.5px solid var(--ink);border-radius:8px;padding:1px 5px 0;vertical-align:middle;margin-left:3px;letter-spacing:.3px}
  .sec-h{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.5px;margin:22px 2px 12px;color:var(--muted)}
  .seccard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:15px 16px;margin-bottom:11px;cursor:pointer;transition:transform .08s, box-shadow .12s}
  .seccard:active{transform:translateY(1px)}
  .seccard:hover{box-shadow:var(--shadow-sm)}
  .seccard .num{width:34px;height:34px;flex:0 0 auto;border-radius:8px;border:2px solid var(--ink);background:var(--yellow);font-family:'Bricolage Grotesque';font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center}
  .seccard.done .num{background:var(--mint)}
  .seccard .body{flex:1;min-width:0}
  .seccard .nm{display:block;font-weight:800;font-size:16px;line-height:1.25}
  .seccard .tg{display:block;font-size:13px;color:var(--muted);margin-top:2px}
  .seccard .mini{display:block;margin-top:9px;height:7px;background:var(--softyellow);border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
  .seccard .mini i{display:block;height:100%;background:var(--pink)}
  .seccard .cnt{font-size:11px;color:var(--muted);font-weight:700;margin-top:5px;display:block}
  .seccard .arw{font-size:20px;color:var(--muted);flex:0 0 auto}

  /* section stepper */
  .subhead{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .subhead .eyebrow{font-size:11px;font-weight:700;color:var(--pinkd)}
  .subhead .of{font-size:11px;color:var(--muted);margin-left:auto}
  .sec-intro{background:var(--blue);border:2px solid var(--ink);border-radius:16px;padding:20px;box-shadow:var(--shadow-sm);margin-bottom:6px}
  .sec-intro h1{font-size:clamp(24px,6vw,32px);font-weight:800;margin-bottom:8px}
  .sec-intro p{font-size:16px}
  .lesson{background:#fff;border:2px solid var(--ink);border-left:8px solid var(--violet);border-radius:12px;padding:18px;margin:12px 0 6px;box-shadow:var(--shadow-sm)}
  .lesson-k{font-size:11px;font-weight:700;color:#6D28D9;margin-bottom:7px}
  .lesson-idea{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;line-height:1.28;margin-bottom:13px;text-wrap:balance}
  .lesson-pts{list-style:none;display:flex;flex-direction:column;gap:9px;margin:0;padding:0}
  .lesson-pts li{position:relative;padding-left:22px;font-size:14.5px;line-height:1.5}
  .lesson-pts li::before{content:"";position:absolute;left:2px;top:7px;width:9px;height:9px;background:var(--violet);border:2px solid var(--ink);border-radius:50%}
  .lesson-pts a{color:var(--pinkd);font-weight:700}
  .lesson-ex{background:#EAFBF4;border:2px solid var(--ink);border-radius:10px;padding:14px 15px;margin-top:15px}
  .lesson-ex-k{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.3px;color:#0B6B4F;margin-bottom:8px}
  .lesson-ex-lead{font-size:14.5px;line-height:1.5;font-weight:600;margin-bottom:11px;text-wrap:pretty}
  .lesson-ex-rows{display:flex;flex-direction:column;gap:0;margin-bottom:11px}
  .lesson-ex-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;line-height:1.4;padding:6px 0;border-top:1px dashed rgba(36,27,46,.22)}
  .lesson-ex-row:first-child{border-top:0}
  .lesson-ex-row span{color:#3F3650}
  .lesson-ex-row b{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
  .lesson-ex-take{font-size:14px;line-height:1.5}
  .lesson-ex-take a{color:var(--pinkd);font-weight:700}
  .lesson-ex-alt{margin-top:11px;padding:10px 12px;background:var(--softyellow);border:1.5px dashed var(--ink);border-radius:9px;font-size:13.5px;line-height:1.5}
  .lesson-ex-alt b{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.3px;display:block;margin-bottom:3px;color:#8A5A00}
  .lesson-ex-src{margin-top:10px;font-size:11.5px;color:#6b6076;font-style:italic}
  .coach{background:#fff;border:2px solid var(--ink);border-left:8px solid var(--pinkd);border-radius:12px;padding:15px 16px;margin:12px 0 6px;box-shadow:var(--shadow-sm)}
  .coach-k{font-size:11px;font-weight:700;color:#A80042;margin-bottom:7px}
  .coach-line{font-size:14.5px;line-height:1.5;margin-bottom:7px;overflow-wrap:anywhere}
  .coach-line:last-child{margin-bottom:0}
  .coach-line b{font-weight:800}
  .block h2{font-size:22px;font-weight:800;margin:0 0 6px;text-wrap:balance}
  .block .help{font-size:15px;color:var(--muted);margin:0 0 18px;max-width:560px}
  .gloss{background:#D2F6EC;border:2px solid var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;margin:0 0 18px}
  .gloss b{display:block;font-size:10px;letter-spacing:.5px;margin-bottom:4px;color:#0A6B50}
  .hint{font-size:13px;color:var(--muted);margin:2px 2px 4px;line-height:1.5}

  .card{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:16px;margin-bottom:12px}
  .qtext{font-size:16px;font-weight:700;margin-bottom:10px;line-height:1.4}
  .flabel{font-size:14px;font-weight:700;margin:0 0 8px;display:block;line-height:1.4}
  .tin{width:100%;font-family:inherit;font-size:16px;font-weight:500;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:12px;padding:12px 13px;outline:none}
  .tin::placeholder{color:#6B6076}
  .tin:focus{box-shadow:var(--shadow-sm)}
  textarea.tin{resize:vertical;min-height:88px;line-height:1.5}

  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:600;padding:11px 15px;background:#fff;border:2px solid var(--ink);border-radius:12px;cursor:pointer;user-select:none;transition:transform .08s, box-shadow .12s, background .12s;line-height:1.25}
  .chip,.optrow,.check{font-family:inherit;color:var(--ink);text-align:left;-webkit-appearance:none;appearance:none}
  .check,.optrow{width:100%}
  .chip.sel::after{content:"✓";font-weight:800;margin-left:1px}
  :is(.chip,.optrow,.check,.seccard,.focus-chip,.feedcard,.grabcard,.scale button,.btn) :focus-visible,
  .chip:focus-visible,.optrow:focus-visible,.check:focus-visible,.seccard:focus-visible,.focus-chip:focus-visible,.feedcard:focus-visible,.grabcard:focus-visible,.scale button:focus-visible,.btn:focus-visible,.tin:focus-visible{outline:3px solid #6D28D9;outline-offset:2px}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
  .chip:active{transform:translateY(1px)}
  .chip.sel{background:var(--yellow);box-shadow:var(--shadow-sm)}
  .chip.mini{padding:9px 13px;font-size:14px}
  .chip .cdesc{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
  .chip.sel .cdesc{color:var(--ink)}

  /* single-choice big rows (archetype) */
  .optrow{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:14px;cursor:pointer;margin-bottom:10px;transition:transform .08s, box-shadow .12s, background .12s}
  .optrow:active{transform:translateY(1px)}
  .optrow.sel{background:var(--blue);box-shadow:var(--shadow-sm)}
  .optrow .dot{width:22px;height:22px;flex:0 0 auto;border-radius:50%;border:2px solid var(--ink);margin-top:1px;display:inline-flex;align-items:center;justify-content:center;background:#fff}
  .optrow.sel .dot{background:var(--ink)}
  .optrow.sel .dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--yellow)}
  .optrow b{font-size:16px;font-weight:800;display:block}
  .optrow span{font-size:14px;color:var(--muted)}

  /* scale 1-10 */
  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:310px}
  .scale button{font-family:'Bricolage Grotesque';font-weight:700;font-size:15px;width:100%;min-height:42px;border:2px solid var(--ink);border-radius:8px;background:#fff;cursor:pointer;color:var(--ink)}
  .scale button.on{background:var(--pinkd);color:#fff;box-shadow:inset 0 0 0 2px var(--ink)}

  /* checklist / check rows */
  .check{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:14px;cursor:pointer;margin-bottom:9px;transition:background .12s}
  .check.on{background:#D2F6EC}
  .check .box{width:23px;height:23px;flex:0 0 auto;border:2px solid var(--ink);border-radius:8px;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:transparent;margin-top:1px}
  .check.on .box{background:var(--mint);color:var(--ink)}
  .check .ctxt{font-size:15px;line-height:1.45}
  .check.on .ctxt{color:var(--muted)}

  /* info */
  .info{background:var(--softyellow);border:2px solid var(--ink);border-radius:12px;padding:18px}
  .info h2{font-size:19px;margin-bottom:10px}
  .info p{font-size:15px;margin-bottom:9px}
  .info p:last-child{margin-bottom:0}
  .info p b{font-weight:800}

  /* table -> stacked row cards */
  .trow{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:15px;margin-bottom:11px}
  .trow .rhead{font-size:15px;font-weight:800;line-height:1.35;margin-bottom:3px}
  .trow .rsub{font-size:13px;color:var(--muted);margin-bottom:11px;line-height:1.4}
  .trow .rsub.pill{display:inline-block;background:var(--blue);border:2px solid var(--ink);border-radius:8px;padding:3px 9px;font-weight:700;color:var(--ink);margin-bottom:11px}
  .tfield{margin-top:11px}
  .tfield:first-child{margin-top:0}
  .trow .check{margin:2px 0 0}

  /* nav */
  .navbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:transparent}
  .navbar-in{max-width:660px;margin:0 auto;display:flex;gap:11px;align-items:center;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:var(--cream);border-top:2px solid var(--ink)}
  @media(min-width:700px){ .navbar-in{border:2px solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0} }
  @media(hover:hover){ .vidrow{scrollbar-width:thin} .vidrow::-webkit-scrollbar{display:block;height:8px} .vidrow::-webkit-scrollbar-thumb{background:var(--ink);border-radius:8px} }
  .btn{font-family:inherit;font-weight:800;font-size:16px;border:2px solid var(--ink);border-radius:12px;padding:13px 20px;cursor:pointer;transition:transform .08s, box-shadow .12s;background:#fff;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--pinkd);color:#fff;box-shadow:var(--shadow);flex:1}
  .btn.back{flex:0 0 auto}
  .btn.wide{width:100%}

  .privacy{font-size:12px;color:var(--muted);text-align:center;margin-top:22px;padding:0 10px}
  .exportrow{display:flex;gap:11px;margin-top:18px}
  .exportrow .btn{flex:1}
  .sitelinks{margin:22px 0 4px;padding:16px 18px;background:var(--softyellow);border:2px solid var(--ink);border-radius:16px;box-shadow:var(--shadow-sm)}
  .sitelinks .sl-h{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:11px}
  .sitelinks a{display:inline-block;margin:0 7px 8px 0;font-size:14px;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px 12px;text-decoration:none}
  .sitelinks a:active{transform:translateY(1px)}
  .sitelinks a:hover{box-shadow:var(--shadow-sm)}

  /* export view */
  .ex-sec{margin-bottom:26px}
  .ex-sec h2{font-size:20px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:12px}
  .ex-item{margin-bottom:12px}
  .ex-item .q{font-size:13px;font-weight:800;color:var(--muted)}
  .ex-item .a{font-size:15px;white-space:pre-wrap}
  .ex-empty{color:var(--muted);font-style:italic;font-size:14px}
  .ex-item .a{overflow-wrap:anywhere;word-break:break-word}
  .tin{overflow-wrap:anywhere}

  /* live feeds (scene + go-deeper) */
  .scene{background:var(--softyellow);border:2px solid var(--ink);border-radius:16px;padding:16px;margin:14px 0 4px;box-shadow:var(--shadow-sm)}
  .deepen{background:var(--blue);border:2px solid var(--ink);border-radius:16px;padding:16px;margin:18px 0 4px;box-shadow:var(--shadow-sm)}
  .scene-h{display:flex;align-items:center;gap:8px;margin-bottom:13px}
  .scene-h .mono{font-size:12px;font-weight:700;color:var(--pinkd)}
  .scene-date{margin-left:auto;font-size:11px;color:var(--muted)}
  .feedgrp{margin-bottom:15px}
  .feedgrp:last-child{margin-bottom:0}
  .fg-h{font-size:13px;font-weight:800;margin:0 0 9px}
  .fg-list{display:flex;flex-direction:column;gap:8px}
  .feedcard{display:block;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:11px 13px;text-decoration:none;color:var(--ink);font-weight:400;transition:transform .08s, box-shadow .12s}
  .feedcard:active{transform:translateY(1px)}
  .feedcard:hover{box-shadow:var(--shadow-sm)}
  .fc-t{font-weight:700;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
  .fc-m{font-size:12px;color:var(--muted);margin-top:3px}
  .fc-empty{font-size:13px;color:var(--muted);padding:5px 0}
  .feedmore{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;color:var(--pinkd);text-decoration:underline}
  .vidrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .vidrow::-webkit-scrollbar{display:none}
  .vidcard{flex:0 0 150px;background:#fff;border:2px solid var(--ink);border-radius:12px;overflow:hidden;text-decoration:none;color:var(--ink)}
  .vidcard img,.vc-noimg{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#EADFF2;border-bottom:2px solid var(--ink)}
  .vc-t{font-weight:700;font-size:12.5px;line-height:1.3;padding:8px 9px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .vidcard .fc-m{padding:2px 9px 9px}

  /* grab-this (templates, contracts, outreach, venues at point of need) */

    // General condition evaluator: supports AND (array), OR ({any:[...]}),
    // is / not (membership), and numeric lte / gte (for pillar ratings).
    function oneCond(c){
      if(!c) return true;
      if(Array.isArray(c)) return c.every(oneCond);
      if(c.any) return c.any.some(oneCond);
      var v=val(c.f);
      if(c.lte!=null) return v!==undefined&&v!==""&&(+v)<=c.lte;
      if(c.gte!=null) return v!==undefined&&v!==""&&(+v)>=c.gte;
      if(c.not) return c.not.indexOf(v)===-1;
      if(c.is)  return c.is.indexOf(v)>-1;
      return v!==undefined&&v!==""&&v!==false;
    }
    // Fill {tokens} in author text from the user's own answers.
    function interp(text){
      if(!text || text.indexOf("{")<0) return text;
      var w=weakPillars(), bg=budgetLvl(), a=val("archetype");
      var T={
        firstName: firstName(),
        goal: goalText(),
        weak1: w[0]?w[0].nm:"", weak2: w[1]?w[1].nm:"",
        distributor: (bg==="none"||bg==="burnt") ? "RouteNote (free, you keep 85%)" : "DistroKid or Madverse",
        archetype: (a&&ARCHETYPE_FOCUS[a])?ARCHETYPE_FOCUS[a].label:"",
        play: (a&&ARCHETYPE_FOCUS[a])?ARCHETYPE_FOCUS[a].play:""
      };
      return text.replace(/\{(\w+)\}/g, function(m,k){ return (k in T) ? T[k] : m; });
    }
    function blockShown(b){ return !b.showIf || oneCond(b.showIf); }

    /* ---- block renderers ---- */
    function renderBlock(b, step){
      step=step||0;
      var multi = b.type==="pillars"||b.type==="qa"||b.type==="fill"||b.type==="builder";
      var head="";
      if(!multi || step===0){
        head = b.title?'<h2>'+esc(b.title)+'</h2>':"";
        head += b.help?'<p class="help">'+esl(b.help)+'</p>':"";
        head += (b.gloss && !advancedUser())?'<div class="gloss"><b class="mono">In plain words</b>'+esl(b.gloss)+'</div>':"";
      }
      var body="";
      if(b.type==="info") return '<div class="info">'+(b.title?'<h2>'+esc(b.title)+'</h2>':"")+b.body.filter(function(p){ return !(p&&typeof p==="object") || oneCond(p.showIf); }).map(function(p){
          var t=interp((p&&typeof p==="object")?p.text:p); var m=String(t).match(/^([^:]{2,40}):\s(.+)$/); return m?'<p><b>'+esc(m[1])+':</b> '+esl(m[2])+'</p>':'<p>'+esl(t)+'</p>'; }).join("")+'</div>';
      else if(b.type==="pillars") body=renderPillarOne(b, step);
      else if(b.type==="qa"){ var q=b.items[step]; body='<div class="card"><div class="qtext">'+esc(interp(q.q))+'</div>'+ta(b.id+"."+q.id,q.ph||"Type your answer",q.q)+'</div>'; }
      else if(b.type==="fill"){ var it=b.items[step]; var k=b.id+"."+it.id; body='<div class="card">'+(it.label?'<label class="flabel">'+esc(it.label)+'</label>':"")+(it.long?ta(k,it.ph||"",it.label):ti(k,it.ph||"",it.label))+'</div>'; }
      else if(b.type==="chips") body=renderChoice(b);
      else if(b.type==="checklist") body=b.items.filter(function(it){ return oneCond(it.showIf); }).map(function(it){ return chk(b.id+"."+it.id, interp(it.text)); }).join("");
      else if(b.type==="note") body='<div class="card"><label class="flabel">Your notes</label>'+ta(b.id,"Anything you want to remember from this section","Your notes")+'</div>';
      else if(b.type==="table") body=renderTable(b);
      else if(b.type==="builder") body=renderBuilderStep(b, step);
      var showTools = b.tools && step===stepCount(b)-1;
      return head+body+(showTools?grabHTML(b.tools):"");
    }

    }
    function ti(k,ph,lab){ return '<input class="tin" data-k="'+k+'" type="text" value="'+esc(val(k)||"")+'" placeholder="'+esc(ph||"")+'"'+(lab?' aria-label="'+esc(lab)+'"':'')+' autocomplete="off">'; }
    function ta(k,ph,lab){ return '<textarea class="tin" data-k="'+k+'" placeholder="'+esc(ph||"")+'"'+(lab?' aria-label="'+esc(lab)+'"':'')+'>'+esc(val(k)||"")+'</textarea>'; }
    function chk(k,text){ var on=!!val(k); return '<button type="button" class="check'+(on?" on":"")+'" data-check="'+k+'" aria-pressed="'+(on?"true":"false")+'"><span class="box" aria-hidden="true">✓</span><span class="ctxt">'+esl(text)+'</span></button>'; }
    function scale(k){ var cur=val(k); var h='<div class="scale">'; for(var i=1;i<=10;i++){ h+='<button type="button" data-scale="'+k+'" data-v="'+i+'" class="'+(String(cur)===String(i)?"on":"")+'">'+i+'</button>'; } return h+'</div>'; }

    function renderPillarOne(b, i){
      var name=WB.pillars[i], base=b.id+"."+i;
      var ctx='<div class="pill-ctx mono">Pillar '+(i+1)+' of '+WB.pillars.length+'</div>';
      if(b.mode==="review"){
        var was=val("baseline."+i+".rating");
        return '<div class="trow">'+ctx+'<div class="rhead">'+esc(name)+'</div>'+
          '<div class="rsub pill">Week 1 rating: '+(was?was+"/10":"not set")+'</div>'+
          '<div class="tfield"><label class="flabel">Where I am now</label>'+scale(base+".now")+'</div>'+
          '<div class="tfield"><label class="flabel">90-day goal</label>'+ti(base+".goal","","90-day goal for "+name)+'</div></div>';
      }
      return '<div class="trow">'+ctx+'<div class="rhead">'+esc(name)+'</div>'+
        '<div class="tfield"><label class="flabel">Rate yourself, 1 to 10</label>'+scale(base+".rating")+'</div>'+
        '<div class="tfield"><label class="flabel">My biggest strength here</label>'+ti(base+".strength","","Biggest strength in "+name)+'</div>'+
        '<div class="tfield"><label class="flabel">My biggest gap here</label>'+ti(base+".gap","","Biggest gap in "+name)+'</div></div>';
    }

    function renderChoice(b){
      // big option rows if descriptions present, else chips
      var cur=val(b.id);
      if(b.options.some(function(o){return o.desc;})){
        return b.options.map(function(o){ var on=cur===o.v; return '<button type="button" class="optrow'+(on?" sel":"")+'" data-choice="'+b.id+'" data-v="'+esc(o.v)+'" aria-pressed="'+(on?"true":"false")+'"><span class="dot" aria-hidden="true"></span><span><b>'+esc(o.label)+'</b><span>'+esc(o.desc||"")+'</span></span></button>'; }).join("");
      }
      return '<div class="chips">'+b.options.map(function(o){ var on=(b.single?cur===o.v:(cur||[]).indexOf(o.v)>-1); return '<button type="button" class="chip'+(on?" sel":"")+'" data-choice="'+b.id+'" data-v="'+esc(o.v)+'" data-single="'+(b.single?1:0)+'" aria-pressed="'+(on?"true":"false")+'">'+esc(o.label)+'</button>'; }).join("")+'</div>';
    }

    function renderTable(b){
      var ro=b.columns.filter(function(c){return c.type==="readonly";});
      var inp=b.columns.filter(function(c){return c.type!=="readonly";});
      return tableRows(b).map(function(r){
        var head="", subs=[];
        if(r._n){ head='<div class="rhead">'+r._n+'.</div>'; }
        else {
          ro.forEach(function(c,idx){ var t=r.cells[c.key]||""; if(idx===0) head='<div class="rhead">'+esl(t)+'</div>'; else if(t) subs.push(esl(t)); });
        }
        var sub = subs.length?'<div class="rsub">'+subs.join(" · ")+'</div>':"";
        var fields=inp.map(function(c){ var k=b.id+"."+r.id+"."+c.key;
          if(c.type==="check") return '<div class="tfield">'+chk(k, c.label)+'</div>';
          if(c.type==="chips"){ var cur=val(k); return '<div class="tfield"><label class="flabel">'+esc(c.label)+'</label><div class="chips">'+c.options.map(function(op){ return '<button type="button" class="chip mini'+(cur===op?" sel":"")+'" data-choice="'+k+'" data-v="'+esc(op)+'" data-single="1" aria-pressed="'+(cur===op?"true":"false")+'">'+esc(op)+'</button>'; }).join("")+'</div></div>'; }
          return '<div class="tfield"><label class="flabel">'+esc(c.label)+'</label>'+ti(k,"",c.label)+'</div>';
        }).join("");
        return '<div class="trow">'+head+sub+fields+'</div>';
      }).join("");
    }

    /* ---- export / print ---- */
    function renderExport(){
      navbar.style.display="none"; crumb.textContent="Your workbook";
      var h='<div class="hero" style="box-shadow:6px 6px 0 var(--mint)"><div class="kick mono">Your workbook</div><h1>Everything you\'ve filled in.</h1><p>Only your answers show here. Print it or save as PDF to keep a copy, or hand it to someone helping you.</p></div>';
      h+='<div class="exportrow"><button class="btn back" id="homeBtn" type="button">← Back</button><button class="btn primary" id="printBtn" type="button">Print / save as PDF</button></div>';
      WB.sections.forEach(function(sec){
        var rows=exportSection(sec);
        if(!rows) return;
        h+='<div class="ex-sec"><h2>'+esc(sec.name)+'</h2>'+rows+'</div>';
      });
      h+='<p class="privacy">Tip: in the print dialog, choose "Save as PDF".</p>';
      stage.innerHTML=h;
    }
    function fmt(v){ if(v===true)return "✓ done"; return esc(v); }
    function exportSection(sec){
      var out="";
      visBlocks(sec).forEach(function(b){
        if(b.type==="info") return;
        var items="";
        if(b.type==="pillars"){ WB.pillars.forEach(function(nm,i){
          if(b.mode==="review"){ var rn=val(b.id+"."+i+".now"), g=val(b.id+"."+i+".goal"); if(rn) items+=exq(nm, rn+"/10"); if(g) items+=exq(nm+", 90-day goal", g); }
          else { var r=val(b.id+"."+i+".rating"), stt=val(b.id+"."+i+".strength"), gp=val(b.id+"."+i+".gap"); if(r) items+=exq(nm, r+"/10"); if(stt) items+=exq(nm+", strength", stt); if(gp) items+=exq(nm+", gap", gp); }
        }); }
        else if(b.type==="qa"){ b.items.forEach(function(it){ var v=val(b.id+"."+it.id); if(v) items+=exq(it.q,v); }); }
        else if(b.type==="fill"){ b.items.forEach(function(it){ var v=val(b.id+"."+it.id); if(v) items+=exq(it.label||it.id,v); }); }
        else if(b.type==="chips"){ var v=val(b.id); if(v){ var lbl=function(x){var o=b.options.filter(function(op){return op.v===x;})[0];return o?o.label:x;}; items+=exq(b.title, Array.isArray(v)?v.map(lbl).join(", "):lbl(v)); } }
        else if(b.type==="note"){ var v=val(b.id); if(v) items+=exq("Notes",v); }
        else if(b.type==="builder"){ if(b.fields.some(function(f){return val(b.id+"."+f.id);})) items+=exq(b.title||"Document", buildDoc(b)); }
        else if(b.type==="checklist"){ var done=b.items.filter(function(it){return val(b.id+"."+it.id);}); if(done.length) items+=exq(b.title||"Checklist", done.map(function(it){return "\u2713 "+it.text;}).join("\n")); }
        else if(b.type==="table"){ tableRows(b).forEach(function(r){ var parts=[]; b.columns.forEach(function(c){ if(c.type==="readonly")return; var v=val(b.id+"."+r.id+"."+c.key); if(v) parts.push(c.label+": "+(v===true?"✓":v)); }); if(parts.length){ var lbl=r._n?(b.title+" #"+r._n):(r.cells[(b.columns[0]||{}).key]||b.title); items+=exq(lbl, parts.join(" · ")); } }); }
        if(items) out+=items;
      });
      return out;
    }
    function exq(q,a){ return '<div class="ex-item"><div class="q">'+esc(q)+'</div><div class="a">'+fmt(a)+'</div></div>'; }

    /* ---- events ---- */
    stage.addEventListener("input",function(e){ var t=e.target; if(t.dataset&&t.dataset.k!=null){ setVal(t.dataset.k, t.value); if(document.getElementById("docPreview")) updatePreview(); } });
    stage.addEventListener("click",function(e){
      var el;
      if((el=e.target.closest("[data-sec]"))){ S.nav={view:"section",sec:+el.dataset.sec,block:0}; save(); render(); return; }
      if(e.target.closest("#exportBtn")||e.target.closest("#exportBtn2")){ S.nav={view:"export"}; save(); render(); return; }
      if(e.target.closest("#homeBtn")){ S.nav={view:"home"}; save(); render(); return; }
      if(e.target.closest("#printBtn")){ window.print(); return; }
      if((el=e.target.closest("#docCopy"))){ var tx=buildDoc(curBuilder); try{navigator.clipboard.writeText(tx);}catch(e2){} el.textContent="Copied ✓"; setTimeout(function(){el.textContent="Copy";},1500); return; }
      if(e.target.closest("#docDl")){ var t2=buildDoc(curBuilder); var bl=new Blob([t2],{type:"text/plain"}); var u=URL.createObjectURL(bl); var a=document.createElement("a"); a.href=u; a.download=(curBuilder.file||"agreement")+".txt"; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(u); return; }
      if((el=e.target.closest("[data-check]"))){ var k=el.dataset.check; setVal(k, !val(k)); el.classList.toggle("on"); el.querySelector(".box").textContent=val(k)?"✓":""; return; }
      if((el=e.target.closest("[data-scale]"))){ var sk=el.dataset.scale, sv=+el.dataset.v; setVal(sk, String(val(sk))===String(sv)?"":sv); el.parentNode.querySelectorAll("button").forEach(function(bn){bn.classList.toggle("on",bn===el&&String(val(sk))===String(sv));}); return; }
      if((el=e.target.closest("[data-choice]"))){
        var ck=el.dataset.choice, cv=el.dataset.v, single=el.dataset.single!=="0";
        if(el.classList.contains("chip")&&!single){ var arr=val(ck)||[]; var idx=arr.indexOf(cv); if(idx>-1)arr.splice(idx,1); else arr.push(cv); setVal(ck, arr.length?arr.slice():""); render(); }
        else { setVal(ck, val(ck)===cv?"":cv); render(); }
        return;
      }
    });
    backBtn.addEventListener("click",function(){
      var bi=S.nav.block||0, st=S.nav.step||0;
      if(st>0){ S.nav.step=st-1; }
      else if(bi>0){ S.nav.block=bi-1; S.nav.step=effSteps(WB.sections[S.nav.sec], bi-1)-1; }
      else { S.nav={view:"home"}; }
      save(); render();
    });
    nextBtn.addEventListener("click",function(){
      var sec=WB.sections[S.nav.sec], bi=S.nav.block||0, st=S.nav.step||0, sc=effSteps(sec, bi);
      if(st<sc-1){ S.nav.step=st+1; }
      else if(bi<visBlocks(sec).length-1){ S.nav.block=bi+1; S.nav.step=0; }
      else { S.nav={view:"secdone", sec:S.nav.sec}; }
      save(); render();
    });

    render();
  })();
  </script>
</body>
</html>
