name: IndexNow ping

# Notifies IndexNow-participating engines (Bing, Yandex, and others) whenever
# the site changes, so new and updated pages are crawled without waiting.
# The IndexNow key is public by design (hosted at /<key>.txt), so it is safe
# to keep in this file.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Submit sitemap URLs to IndexNow
        run: |
          set -euo pipefail
          KEY="5570c9a3e95a49e587a509eda7662b24"
          HOST="indiemusicindia.com"
          if [ ! -f sitemap.xml ]; then echo "no sitemap.xml, skipping"; exit 0; fi
          URLS=$(grep -oE '<loc>[^<]+</loc>' sitemap.xml | sed -e 's/<loc>//' -e 's#</loc>##')
          if [ -z "$URLS" ]; then echo "no URLs found, skipping"; exit 0; fi
          BODY=$(printf '%s\n' "$URLS" | jq -R . | jq -s \
            --arg host "$HOST" --arg key "$KEY" \
            --arg kl "https://$HOST/$KEY.txt" \
            '{host:$host, key:$key, keyLocation:$kl, urlList:.}')
          echo "Submitting:"; echo "$BODY"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$BODY")
          echo "IndexNow response: $code"
          # 200 and 202 are both success; anything else is a soft failure
          case "$code" in 200|202) echo "ok" ;; *) echo "non-success ($code), not failing the build" ;; esac
